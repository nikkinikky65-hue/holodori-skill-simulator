<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ホロドリ カードライブラリ</title>
<link rel="stylesheet" href="style.css">
<script src="site-navigation.js" defer></script>
</head>
<body>
<main class="wrap">
<section class="panel">
  <h1>カードライブラリ</h1>
  <div class="catalogFilters">
    <label>カード名・メンバー名<input id="catalogSearch" type="search"></label>
    <div class="catalogRarity" role="group" aria-label="レア度">
      <button type="button" data-catalog-rarity="5" aria-pressed="true">★5</button>
      <button type="button" data-catalog-rarity="4" aria-pressed="false">★4</button>
      <button type="button" data-catalog-rarity="3" aria-pressed="false">★3</button>
    </div>
    <label>タイプ<select id="catalogType"><option value="">すべて</option><option value="cute">キュート</option><option value="happy">ハッピー</option><option value="pure">ピュア</option></select></label>
  </div>
  <p id="catalogStatus" role="status">カードデータを読み込み中…</p>
</section>
<div id="catalogCards" class="catalogCards"></div>
<section class="panel" aria-label="データについて">
  <h2>データについて</h2>
  <p class="sub">P/T/Sは特訓上限の基礎値を個別に切り上げて分配し、開花補正後に再度切り上げます。TOTALは3項目の合計です。ボード・メモリー・編成補正は含みません。育成状態が不明な旧保存は「—」で表示します。</p>
  <p class="sub">呼び出したカードのタイムライン・編成探索への反映はActive Skill基本効果のみです。条件付き効果・Passive・Special・Connect・表示ステータスは評価に反映しません。</p>
</section>
</main>
<script src="members.js"></script>
<script src="canonical-card-adapter.js?v=b4659e28157c"></script>
<script src="user-card-state.js"></script>
<script src="card-catalog.js?v=6d3e84c523c7"></script>
</body>
</html>
