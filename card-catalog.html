<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ホロドリ カードライブラリ</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="talent-filter.css">
<link rel="stylesheet" href="skill-filter.css">
<link rel="stylesheet" href="catalog-sp.css">
<script src="site-navigation.js" defer></script>
</head>
<body>
<main class="wrap">
<section class="panel">
  <h1>カードライブラリ</h1>
  <div class="catalogViewModes" role="group" aria-label="表示モード">
    <button type="button" data-catalog-view="detail" aria-pressed="true">詳細</button>
    <button type="button" disabled>ステータス（未実装）</button>
    <button type="button" data-catalog-view="sp" aria-pressed="false">SP</button>
    <button type="button" disabled>Active（未実装）</button>
    <button type="button" disabled>Passive（未実装）</button>
  </div>
  <div class="catalogExport"><button id="catalogExport" type="button" disabled>所持・育成JSONを出力</button><span id="catalogExportStatus" role="status"></span></div>
  <div class="catalogFilters">
    <label>カード名・メンバー名<input id="catalogSearch" type="search"></label>
    <div class="catalogRarity" role="group" aria-label="レア度">
      <button type="button" data-catalog-rarity="5" aria-pressed="true">★5</button>
      <button type="button" data-catalog-rarity="4" aria-pressed="false">★4</button>
      <button type="button" data-catalog-rarity="3" aria-pressed="false">★3</button>
    </div>
    <label>タイプ<select id="catalogType"><option value="">すべて</option><option value="cute">キュート</option><option value="happy">ハッピー</option><option value="pure">ピュア</option></select></label>
  </div>
  <div class="catalogSearchActions"><div id="catalogTalentFilter"></div><div id="catalogSkillFilter"></div></div>
  <p id="catalogStatus" role="status">カードデータを読み込み中…</p>
</section>
<div id="catalogCards" class="catalogCards"></div>
<section id="catalogSP" class="panel" hidden aria-label="SP比較"></section>
<section class="panel" aria-label="データについて">
  <h2>データについて</h2>
  <p class="sub">P/T/Sは特訓上限の基礎値を個別に切り上げて分配し、開花補正後に再度切り上げます。TOTALは3項目の合計です。ボード・メモリー・編成補正は含みません。育成状態が不明な旧保存は「—」で表示します。</p>
  <p class="sub">呼び出したカードのタイムライン・編成探索への反映はActive Skill基本効果のみです。条件付き効果・Passive・Special・Connect・表示ステータスは評価に反映しません。</p>
</section>
</main>
<script src="members.js"></script>
<script src="canonical-card-adapter.js?v=8f18296bae96"></script>
<script src="talent-presentation.js"></script><script src="talent-filter.js"></script>
<script src="passive-skill-filter.js"></script><script src="skill-filter.js"></script>
<script src="user-card-state.js"></script>
<script src="skill-description-text.js"></script>
<script src="activation-probability-engine.js"></script>
<script src="card-image-resolver.js"></script>
<script src="catalog-sp-data.js"></script>
<script src="catalog-sp-table.js"></script>
<script src="card-catalog.js?v=6bb4a08380dd"></script>
</body>
</html>
