<meta charset="utf-8"><pre>RUNNING</pre><iframe></iframe><script>
(async()=>{const out=document.querySelector('pre'),f=document.querySelector('iframe'),backup=new Map(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)]));const check=(x,m)=>{if(!x)throw Error(m);};const pause=()=>new Promise(r=>setTimeout(r,10));try{for(const width of [1100,360]){
localStorage.clear();f.style.width=width+'px';const w=await new Promise(r=>{f.onload=()=>r(f.contentWindow);f.src='../event.html'});await w.eval('candidateReady');const d=w.document,cat=await w.loadRuntimeCardCatalog();const unique=cat.cards.filter((c,i,a)=>a.findIndex(x=>x.member.name===c.member.name)===i).slice(0,20);
w.__cards=unique.map(c=>w.adaptCanonicalCardToEventCard(c,1,w.expandCanonicalBloom(c,0,cat.dataset,0)));w.eval('memberCards.splice(0,memberCards.length,...window.__cards)');w.renderRequiredSlots();
d.querySelector('#searchFormation').click();check(d.querySelector('#searchStatus').textContent.includes('上限'),'block over cap');check(!w.eval('searchRunning'),'not started');

w.eval('memberCards.splice(5)');const formations=w.generateFormations([],w.eval('memberCards'));check(formations.length===1&&new Set(formations[0].map(c=>c.talentId)).size===5,'distinct talent');
const expected=w.buildFinalResults(w.selectFinalists(formations,120),120);const generator=w.optimizeFormationSteps(formations[0],120);let step;do{step=generator.next()}while(!step.done);check(step.value.score===expected[0].optimizedScore&&JSON.stringify(step.value.shorts)===JSON.stringify(expected[0].shorts),'generator matches sync score/order');
d.querySelector('#searchFormation').click();check(d.querySelector('#searchFormation').disabled,'double run disabled');d.querySelector('#cancelSearch').click();for(let i=0;i<500&&w.eval('searchRunning');i++)await pause();check(d.querySelector('#searchStatus').textContent.includes('中断'),'cancel');
d.querySelector('#searchFormation').click();for(let i=0;i<1000&&w.eval('searchRunning');i++)await pause();check(!w.eval('searchRunning')&&d.querySelector('#formationResults').textContent.includes(unique[0].name),'normal completion');check(d.documentElement.scrollWidth<=width,'fits');
}out.textContent='PASS: cap rejection, cancellation, duplicate-run guard, scoring equivalence, same-talent exclusion, 1100/360';}catch(e){out.textContent='FAIL '+e.stack}finally{localStorage.clear();for(const[k,v]of backup)localStorage.setItem(k,v)}})();</script>
