<!doctype html><meta charset="utf-8"><title>Card v2 regression tests</title>
<p>専用ブラウザープロファイルで実行してください。このオリジンのテスト用保存データを使用します。</p>
<pre id="result">RUNNING</pre><iframe id="page"></iframe>
<script>
(async () => {
  const result = document.querySelector('#result');
  const frame = document.querySelector('#page');
  const errors = [];
  const key = 'holodori-member-card-library-v2';
  const backup = new Map(Object.keys(localStorage).map(k => [k,localStorage.getItem(k)]));
  const assert = (c,m) => { if(!c) throw Error(m); };
  const open = name => new Promise(resolve => {
    frame.onload = () => resolve(frame.contentWindow);
    frame.src = '../' + name;
  });
  const watch = w => w.addEventListener('error', e => errors.push(e.message));
  const input = (w, selector, value) => {
    const el = w.document.querySelector(selector); assert(el,selector);
    if(el.matches('output[data-catalog-training], output[data-catalog-bloom]')){
      const target=Number(value);
      for(let steps=0;Number(el.value)!==target && steps<6;steps++){
        const direction=Number(el.value)<target?'1':'-1';
        const button=el.closest('.catalogStepper').querySelector(`[data-step="${direction}"]`);
        assert(!button.disabled,'stepper reaches requested value');button.click();
      }
      assert(Number(el.value)===target,'stepper value updated');return;
    }
    el.value = value; el.dispatchEvent(new w.Event('input',{bubbles:true}));
    el.dispatchEvent(new w.Event('change',{bubbles:true}));
  };
  const click = (w,s) => {const el=w.document.querySelector(s);assert(el,s);el.click();};
  const read = () => JSON.parse(localStorage.getItem(key)).cards;
  try{
    localStorage.clear();
    let w = await open('index.html'); watch(w); w.alert = () => {};
    assert(w.document.querySelectorAll('.card').length === 5,'A startup');
    input(w,'[data-k=memberId]','tokino_sora');
    input(w,'[data-k=interval]',15);input(w,'[data-k=duration]',5);input(w,'[data-k=boost]',20);
    const before = w.document.querySelector('#max').textContent;
    assert(Number(before) === 700,'known timeline score: '+before+'; '+errors.join('; '));
    click(w,'[data-save-library="0"]');
    input(w,'#cardSaveName','自由なカード名');input(w,'#cardSaveTraining',2);
    click(w,'#cardSaveConfirm');
    let card = read()[0]; const id=card.id;
    assert(id && card.progression.level===60 && card.stats.total===22000,'A save derived');
    assert(card.progression.bloom===0 && card.talentId==='tokino_sora','A schema');
    assert(w.document.querySelector('#max').textContent===before,'score unchanged');
    // Future fields must survive a Library edit and an A-side update.
    card.extensions={future:42};card.skills.active.extra='keep';
    localStorage.setItem(key,JSON.stringify({version:2,cards:[card]}));
    w=await open('library.html');watch(w);
    click(w,'.libraryItemButtons button');
    input(w,'#cardName','編集したカード名');input(w,'#cardBloom',5);
    assert(Number(w.document.querySelector('#cardTotal').value)===22000,'bloom keeps stats');
    input(w,'#cardPerformance',7777);
    const total=Number(w.document.querySelector('#cardTotal').value);
    w.document.querySelector('#memberCardForm').requestSubmit();
    card=read()[0];
    assert(card.id===id && card.progression.bloom===5 && card.stats.total===total,'Library edit');
    assert(card.extensions.future===42 && card.skills.active.extra==='keep','unknown fields survive');
    assert(Number(w.document.querySelector('#cardLevel').value)===40,'reset derived');
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    click(w,'[data-load-library="0"]');
    assert(!w.document.querySelector('#cardLoadModal').hidden,'load button wired');
    click(w,'.cardLoadItem');
    assert(w.document.querySelector('#cardLoadModal').hidden,'modal closes');
    assert(w.document.querySelector('[data-k=costume]').value==='編集したカード名','name roundtrip');
    assert(w.document.querySelector('[data-k=libraryCardId]').value===id,'id roundtrip');
    click(w,'[data-save-library="0"]');click(w,'#cardSaveConfirm');
    card=read()[0];
    assert(read().length===1 && card.id===id && card.stats.total===total && card.progression.bloom===5,'A update preserves metadata');
    assert(card.extensions.future===42 && card.skills.active.extra==='keep','A preserves future fields');
    // Library ★3 presets at every training level and bloom independence.
    w=await open('library.html');watch(w);
    input(w,'#cardTalent','robocosan');input(w,'#cardName','★3概算');input(w,'#cardRarity',3);
    for(const [training,total] of [10000,12000,16000,18000,20000].entries()){
      input(w,'#cardTraining',training);
      assert(Number(w.document.querySelector('#cardLevel').value)===20+training*10,'star3 level');
      assert(Number(w.document.querySelector('#cardTotal').value)===total,'star3 total');
      input(w,'#cardBloom',training+1);
      assert(Number(w.document.querySelector('#cardTotal').value)===total,'bloom independent');
    }
    w.document.querySelector('#memberCardForm').requestSubmit();
    const star3=read().find(c=>c.cardName==='★3概算');
    assert(star3.id && star3.progression.level===60 && star3.stats.total===20000 && star3.progression.bloom===5,'Library new star3 card');
    // New A-side ★3 uses exactly the same domain presets.
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    input(w,'[data-k=memberId]','robocosan');
    click(w,'[data-save-library="0"]');
    input(w,'#cardSaveName','A面★3');input(w,'#cardSaveRarity',3);input(w,'#cardSaveTraining',2);
    click(w,'#cardSaveConfirm');
    const aStar3=read().find(c=>c.cardName==='A面★3');
    assert(aStar3.progression.level===40 && aStar3.stats.total===16000 && aStar3.progression.bloom===0,'A star3 preset');
    // Blank quick save → Library rename → A-side recall/update.
    input(w,'[data-k=memberId]','azki');input(w,'[data-k=costume]','');
    click(w,'[data-save-library="0"]');
    assert(w.document.querySelector('#cardSaveName').value==='未分類','modal default');
    input(w,'#cardSaveName','   ');click(w,'#cardSaveConfirm');
    const quick=read().find(c=>c.talentId==='azki');
    assert(quick.cardName==='未分類','quick-save default');
    assert(w.document.querySelector('[data-k=costume]').value==='未分類','costume default');
    w=await open('library.html');watch(w);
    const row=[...w.document.querySelectorAll('.libraryCardItem')].find(el=>el.textContent.includes('AZKi'));
    row.querySelector('button').click();
    assert(w.document.querySelector('#cardName').value==='未分類','Library reads default');
    input(w,'#cardName','正式カード名');w.document.querySelector('#memberCardForm').requestSubmit();
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    click(w,'[data-load-library="0"]');
    [...w.document.querySelectorAll('.cardLoadItem')].find(el=>el.textContent.includes('正式カード名')).click();
    assert(w.document.querySelector('[data-k=costume]').value==='正式カード名','renamed recall');
    click(w,'[data-save-library="0"]');input(w,'#cardSaveName','');click(w,'#cardSaveConfirm');
    assert(read().find(c=>c.id===quick.id).cardName==='正式カード名','blank update preserves name');
    // Event page reads v2 and maps its Active fields.
    w=await open('event.html');watch(w);
    assert(w.eval('memberCards.length')===4,'event v2');
    assert(w.eval('cardToActiveMember(memberCards[0],1).interval')===15,'event active mapping');
    // Formation persistence: six references, five Active lanes, latest cards.
    const formationKey='holodori-formation-library-v1';
    const six=w.eval(`HOLO_MEMBERS.slice(0,6).map((talent,i)=>createCardV2({
      id:'six-'+i,talentId:talent.id,cardName:'編成カード'+i,
      skills:{active:{interval:15+i,duration:5,boost:20+i}}
    }))`);
    localStorage.setItem(key,JSON.stringify({version:2,cards:six}));
    const cardSnapshot=localStorage.getItem(key);
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    six.slice(1).forEach((card,i)=>w.loadLibraryCardIntoSlot(card,i));
    const score=w.document.querySelector('#max').textContent;
    const timeline=w.document.querySelector('#timeline').innerHTML;
    input(w,'#formationLeader','six-0');input(w,'#formationName','保存編成');
    assert(w.document.querySelector('#max').textContent===score,'leader does not affect score');
    click(w,'#formationSave');
    const formations=JSON.parse(localStorage.getItem(formationKey));
    const f=formations.formations[0];
    assert(formations.version===1 && f.leader==='six-0' && f.members.join(',')==='six-1,six-2,six-3,six-4,six-5','six ID references');
    assert(Object.keys(f).sort().join(',')==='id,leader,members,name','no card copies');
    assert(localStorage.getItem(key)===cardSnapshot,'formation save leaves cards unchanged');
    assert(w.document.querySelector('#timeline').innerHTML===timeline,'save leaves timeline unchanged');
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    input(w,'#formationSelect',f.id);click(w,'#formationLoad');
    assert(w.document.querySelector('#formationLeader').value==='six-0','restore leader');
    const slots=[...w.document.querySelectorAll('.card')];
    assert(slots.length===5,'still five Active lanes');
    slots.forEach((slot,i)=>{
      assert(slot.querySelector('[data-k=libraryCardId]').value==='six-'+(i+1),'restore member order');
      assert(Number(slot.querySelector('[data-k=interval]').value)===six[i+1].skills.active.interval,'restore active');
    });
    assert(w.document.querySelector('#max').textContent===score && w.document.querySelector('#timeline').innerHTML===timeline,'restore same score and timeline');
    six[2].skills.active.boost=77;
    localStorage.setItem(key,JSON.stringify({version:2,cards:six}));
    click(w,'#formationLoad');
    assert(Number(slots[1].querySelector('[data-k=boost]').value)===77,'read latest card');
    const formationSnapshot=localStorage.getItem(formationKey);
    localStorage.setItem(key,JSON.stringify({version:2,cards:six.filter(c=>c.id!=='six-3')}));
    click(w,'#formationLoad');
    assert(slots[2].querySelector('[data-k=libraryCardId]').value==='' && slots[2].querySelector('[data-k=boost]').value==='','clear missing slot');
    assert(w.document.querySelector('#formationStatus').textContent.includes('通常枠3'),'missing notice');
    assert(slots.filter(slot=>slot.querySelector('[data-k=libraryCardId]').value).length===4 && w.document.querySelector('#formationLeader').value==='six-0','remaining five references restore');
    click(w,'#formationSave');
    assert(localStorage.getItem(formationKey)===formationSnapshot,'incomplete save refused');
    localStorage.setItem(key,JSON.stringify({version:2,cards:six.slice(1)}));
    click(w,'#formationLoad');
    assert(w.document.querySelector('#formationStatus').textContent.includes('リーダー'),'missing leader notice');
    assert(slots.every(slot=>slot.querySelector('[data-k=libraryCardId]').value),'missing leader does not block members');
    assert(localStorage.getItem(formationKey)===formationSnapshot,'missing references do not rewrite saved formation');
    // Snapshot reads the normal render's internal results without side effects.
    input(w,'[data-k=short]',12);
    const beforeStorage=JSON.stringify(Object.keys(localStorage).filter(k=>k!=='holodori-user-card-state-v1').sort().map(k=>[k,localStorage.getItem(k)]));
    const beforeScore=w.document.querySelector('#max').textContent;
    const beforeTimeline=w.document.querySelector('#timeline').innerHTML;
    const beforeInputs=JSON.stringify([...w.document.querySelectorAll('input,select')].map(el=>el.value));
    w.eval("optimizeShortRates = () => { throw Error('snapshot must not optimize'); }");
    const snapshot=w.createActiveTimelineSnapshot();
    const source=w.eval('currentActiveTimelineData');
    assert(snapshot.activeTimeline.length===5,'snapshot five slots');
    snapshot.activeTimeline.forEach((slot,i)=>{
      assert(JSON.stringify(slot.activationTimes)===JSON.stringify(source.eventsByMember[i].map(e=>e.start)),'exact displayed source times');
      assert(slot.effectiveInterval===w.adjustedInterval(source.members[i]),'effective interval');
      assert(slot.cardId===f.members[i] && slot.boost===source.members[i].boost,'snapshot IDs and effective boost');
    });
    assert(snapshot.activeTimeline[0].effectiveInterval===16/1.12,'frequency UP precision');
    assert(snapshot.formation.leaderCardId===f.leader && snapshot.formation.id===null,'leader and honest formation linkage');
    assert(snapshot.maxScore===source.maxScore,'unrounded max score');
    snapshot.activeTimeline[0].activationTimes.push(-1);
    assert(!w.createActiveTimelineSnapshot().activeTimeline[0].activationTimes.includes(-1),'detached snapshot');
    assert(JSON.stringify(Object.keys(localStorage).filter(k=>k!=='holodori-user-card-state-v1').sort().map(k=>[k,localStorage.getItem(k)]))===beforeStorage,'snapshot does not persist');
    assert(w.document.querySelector('#max').textContent===beforeScore && w.document.querySelector('#timeline').innerHTML===beforeTimeline,'snapshot does not redraw');
    assert(JSON.stringify([...w.document.querySelectorAll('input,select')].map(el=>el.value))===beforeInputs,'snapshot does not change inputs');
    let copied;
    Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async value=>{copied=value;}}});
    await w.copyActiveTimelineSnapshot();
    assert(JSON.parse(copied).activeTimeline.length===5 && w.document.querySelector('#activeSnapshotStatus').textContent==='解析用JSONをコピーしました','clipboard success');
    Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async ()=>{throw Error('denied');}}});
    await w.copyActiveTimelineSnapshot();
    assert(!w.document.querySelector('#activeSnapshotFallback').hidden && JSON.parse(w.document.querySelector('#activeSnapshotText').value).activeTimeline.length===5,'clipboard fallback');
    // Score Support rates remain available only through the internal API.
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    const supportCards=w.eval(`HOLO_MEMBERS.slice(0,5).map((talent,i)=>createCardV2({
      id:'support-'+i,talentId:talent.id,cardName:'Support検証'+i,type:i<2?'cute':'pure',
      skills:{active:{interval:20+i,duration:5,boost:i===0?75:i===1?85:65},
      passive:{scoreSupport:{boost:i===2?8:0,targetType:'cute',targetCount:2}}}
    }))`);
    localStorage.setItem(key,JSON.stringify({version:2,cards:supportCards}));
    supportCards.forEach((card,i)=>w.loadLibraryCardIntoSlot(card,i));
    const timesBefore=w.createActiveTimelineSnapshot().activeTimeline.map(m=>m.activationTimes);
    assert(!w.document.querySelector('[data-k=scoreSupportRate]'),'no production rate input');
    const apiParty=w.precalculateParty(w.getMembers().map(member=>({...member,scoreSupportRate:80})));
    assert(apiParty.members[0].effectiveBoost===141 && apiParty.members[0].supportBoost===66,'internal rate API retained');
    let supportSnapshot=w.createActiveTimelineSnapshot();
    const first=supportSnapshot.activeTimeline[0];
    assert(first.baseBoost===75 && first.scoreSupportRate===0 && first.passiveAdditionalSupportRate===8 && first.effectiveSupportRate===8 && first.supportBoost===6 && first.effectiveBoost===81,'Special rate not connected to UI');
    assert(first.boost===81 && first.scoreSupportBoost===6,'export v1 aliases');
    assert(first.supportRateModifiers[0].sourceType==='passive' && first.supportRateModifiers[0].sourceCardId==='support-2','export modifier origin');
    assert(JSON.stringify(timesBefore)===JSON.stringify(supportSnapshot.activeTimeline.map(m=>m.activationTimes)),'support never changes activation times');
    click(w,'[data-save-library="0"]');click(w,'#cardSaveConfirm');
    assert(!JSON.stringify(read()).includes('scoreSupportRate'),'normal rate not saved to Card v2');
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    const inputKey='holodori-active-input-v1';
    assert(JSON.parse(localStorage.getItem(inputKey)).members.every(member=>!Object.hasOwn(member,'scoreSupportRate')),'rate not saved in input state');
    const legacyState=JSON.parse(localStorage.getItem(inputKey));
    legacyState.members.forEach(member=>member.scoreSupportRate=135);
    localStorage.setItem(inputKey,JSON.stringify(legacyState));
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    assert(w.createActiveTimelineSnapshot().activeTimeline.every(member=>member.scoreSupportRate===0),'legacy rate ignored');
    input(w,'#song',120);
    assert(JSON.parse(localStorage.getItem(inputKey)).members.every(member=>!Object.hasOwn(member,'scoreSupportRate')),'next save drops obsolete rate');
    click(w,'#optimizeBtn');
    assert(w.document.querySelector('#optimizedTimeline').textContent.includes('現在'),'optimizer accepts prepared support boost');
    // Card library still retains boost=8 as a Passive rate modifier.
    const exportFixture=JSON.parse(localStorage.getItem(key));
    exportFixture.cards[0].extensions={future:42};
    exportFixture.cards[0].skills.active.extra='keep';
    localStorage.setItem(key,JSON.stringify(exportFixture));
    w=await open('library.html');watch(w);
    const exportStorageBefore=localStorage.getItem(key);
    let exportedBlob;
    let exportedFilename;
    w.URL.createObjectURL=blob => { exportedBlob=blob; return 'blob:test'; };
    w.URL.revokeObjectURL=() => {};
    w.HTMLAnchorElement.prototype.click=function(){ exportedFilename=this.download; };
    click(w,'#memberCardExport');
    const exportedLibrary=JSON.parse(await exportedBlob.text());
    const savedLibrary=JSON.parse(exportStorageBefore);
    assert(exportedFilename==='holodori-card-library-v2.json','library export filename');
    assert(exportedLibrary.version===2 && exportedLibrary.cards.length===savedLibrary.cards.length,'library export root');
    assert(exportedLibrary.cards[0].extensions && exportedLibrary.cards[0].skills.active.extra==='keep','library export unknown fields');
    assert(localStorage.getItem(key)===exportStorageBefore,'library export leaves storage unchanged');
    localStorage.setItem(key,'broken');
    click(w,'#memberCardExport');
    assert(w.document.querySelector('#memberCardExportStatus').textContent.includes('出力できませんでした'),'library export invalid data error');
    localStorage.setItem(key,exportStorageBefore);
    const sourceRow=[...w.document.querySelectorAll('.libraryCardItem')].find(el=>el.textContent.includes('Support検証2'));
    sourceRow.querySelector('button').click();
    assert(Number(w.document.querySelector('#passiveValue').value)===8,'legacy passive boost retained');
    input(w,'#passiveTargetCount',1);w.document.querySelector('#memberCardForm').requestSubmit();
    w=await open('index.html');watch(w);w.alert=()=>{};
    await w.waitForCanonicalRestore();
    supportSnapshot=w.createActiveTimelineSnapshot();
    assert(supportSnapshot.activeTimeline[0].effectiveBoost===75 && supportSnapshot.activeTimeline[0].passiveAdditionalSupportRate===0,'ambiguous targets excluded');
    assert(supportSnapshot.supportEvaluation.status==='partial' && supportSnapshot.supportEvaluation.passiveResults[0].candidateCount===2,'ambiguity exported');
    assert(w.document.querySelector('#supportEvaluation').textContent.includes('未確定'),'ambiguity displayed');
    supportSnapshot.activeTimeline[0].supportRateModifiers[0].value=999;
    assert(w.createActiveTimelineSnapshot().activeTimeline[0].supportRateModifiers[0].value===8,'modifier snapshot detached');
    // Full manual Library form and legacy migration.
    const legacyCard=w.eval(`createCardV2({id:'legacy-manual',talentId:'tokino_sora',cardName:'旧カード名',type:'cute',extensions:{future:42},skills:{
      active:{interval:35,probability:'mid',duration:8,boost:75,description:'A原文',future:1},
      special:{description:'SP原文',future:2},
      passive:{status:{description:'旧ステータス説明'},future:{keep:true},scoreSupport:{conditionType:'cute',conditionCount:3,targetType:'pure',targetCount:2,boost:8,description:'旧P原文',future:3}}
    }})`);
    legacyCard.skills.special.effects=[
      {type:'skill_activation_rate_up',value:12,extra:'keep'},
      {type:'judgement_enhancement',from:'good',to:'perfect'}
    ];
    localStorage.setItem(key,JSON.stringify({version:2,cards:[legacyCard]}));
    w=await open('library.html');watch(w);
    input(w,'#cardTalent','robocosan');input(w,'#cardName','  ');
    input(w,'#passiveEffectType','score_support');input(w,'#passiveCondition','affiliation:0期生');
    input(w,'#passiveConditionCount',3);input(w,'#passiveTarget','type:cute');input(w,'#passiveTargetCount',2);
    input(w,'#passiveValue',8);input(w,'#passiveDescription','P説明');
    input(w,'#specialEffectAddType','life_recovery');
    input(w,'#specialFixedEffects .specialFixedEffectRow[data-special-fixed-type="score_support"] input[data-special-effect-field="value"]',80);
    input(w,'#specialFixedEffects .specialFixedEffectRow[data-special-fixed-type="score_support"] input[data-special-effect-field="duration"]',10);
    input(w,'#specialFixedEffects .specialFixedEffectRow[data-special-fixed-type="life_recovery"] input[data-special-effect-field="value"]',300);
    input(w,'#specialSkillDescription','複合SP');
    input(w,'#activeSkillInterval',35);input(w,'#activeSkillDuration',8);input(w,'#activeSkillBoost',75);
    w.document.querySelector('#memberCardForm').requestSubmit();
    const manual=read().find(c=>c.talentId==='robocosan');
    assert(manual && manual.cardName==='未分類','optional card name saved');
    assert(manual.skills.passive.effect.type==='score_support' && manual.skills.passive.effect.value===8,'P effect saved');
    assert(manual.skills.passive.effect.condition.kind==='affiliation' && manual.skills.passive.effect.condition.value==='0期生' && manual.skills.passive.effect.target.value==='cute','condition and target independent');
    assert(manual.skills.passive.effect.conditionCount===3 && manual.skills.passive.effect.targetCount===2,'counts independent');
    assert(manual.skills.special.effects.length===2 && manual.skills.special.effects.some(effect=>effect.type==='score_support' && effect.value===80 && effect.duration===10) && manual.skills.special.effects.some(effect=>effect.type==='life_recovery' && effect.value===300),'SP compound saved');
    assert(manual.skills.active.effectType==='score_up' && manual.skills.active.boost===75,'A effect preserved');
    const editNamed=(win,name)=>[...win.document.querySelectorAll('.libraryCardItem')].find(el=>el.querySelector('strong').textContent.includes(name)).querySelector('button').click();
    w=await open('library.html');watch(w);editNamed(w,'未分類');
    assert(w.document.querySelector('#passiveCondition').value==='affiliation:0期生' && w.document.querySelector('#passiveValue').value==='8','P reload');
    assert(w.document.querySelector('#specialFixedEffects .specialFixedEffectRow[data-special-fixed-type="score_support"] input[data-special-effect-field="value"]').value==='80' && w.document.querySelector('#specialFixedEffects .specialFixedEffectRow[data-special-fixed-type="score_support"] input[data-special-effect-field="duration"]').value==='10' && w.document.querySelector('#specialFixedEffects .specialFixedEffectRow[data-special-fixed-type="life_recovery"] input[data-special-effect-field="value"]').value==='300','SP reload');
    input(w,'#passiveEffectType','performance_up');w.document.querySelector('#memberCardForm').requestSubmit();
    w=await open('library.html');watch(w);editNamed(w,'未分類');
    assert(w.document.querySelector('#passiveEffectType').value==='performance_up' && w.document.querySelector('#passiveValue').value==='8','status P reload');
    click(w,'#memberCardCancel');editNamed(w,'旧カード名');
    assert(w.document.querySelector('#passiveEffectType').value==='score_support' && w.document.querySelector('#passiveValue').value==='8','legacy score support mapped');
    assert(w.document.querySelector('#passiveCondition').value==='type:cute' && w.document.querySelector('#passiveTarget').value==='type:pure','legacy criteria mapped');
    assert(!w.document.querySelector('#legacyPassiveDetails').hidden,'legacy status description accessible');
    input(w,'#cardName','');input(w,'#passiveValue',9);w.document.querySelector('#memberCardForm').requestSubmit();
    let upgraded=read().find(c=>c.id==='legacy-manual');
    assert(upgraded.cardName==='旧カード名' && upgraded.skills.passive.effect.value===9 && !Object.hasOwn(upgraded.skills.passive,'scoreSupport') && Array.isArray(upgraded.skills.special.effects) &&

      const card=catalog.cards.find(c=>c.name==='サクラBloom');
      assert(w.document.querySelector('.catalogCard .canonicalSlotStatus:last-child').textContent.replace(/(SP|A|P) Lv\.\d+：/g,'$1：').replace('\nTOTAL ', ' / TOTAL ')===w.canonicalEffectsText(w.expandCanonicalBloom(card,bloom,catalog.dataset)).replace(/\n(SP：[\s\S]*?)\n(P：[\s\S]*?)\n(A：[\s\S]*)$/, '\n$1\n$3\n$2'),'library uses common Bloom/display');
    }
    assert([...w.document.querySelectorAll('[data-catalog-rarity]')].map(b=>b.textContent).join()==='★5,★4,★3','rarity category order');
    let visitedCards=0;
    // Every rarity and training stage changes the displayed source base value.
    for(const rarity of [3,4,5]){
      input(w,'#catalogSearch','');click(w,`[data-catalog-rarity="${rarity}"]`);
      visitedCards+=w.document.querySelectorAll('.catalogCard').length;
      const displayed=[...w.document.querySelectorAll('.catalogCard')];
      const displayedCards=displayed.map(panel=>catalog.cards.find(card=>card.id===panel.dataset.cardId));
      const memberIds=displayedCards.map(card=>w.canonicalMemberId(card));
      assert(memberIds.every((id,i)=>registrationMemberOrder.includes(id) && (i===0 || registrationMemberOrder.indexOf(memberIds[i-1])<=registrationMemberOrder.indexOf(id))),'matches actual registration member order');
      assert(new Set(memberIds).size===memberIds.filter((id,i)=>i===0 || id!==memberIds[i-1]).length,'same member contiguous');
      for(const panel of displayed){
        const text=panel.querySelector('.canonicalSlotStatus:last-child').textContent;
        assert(text.indexOf('\nSP Lv.')<text.indexOf('\nA Lv.') && text.indexOf('\nA Lv.')<text.indexOf('\nP Lv.'),'every card displays SP/A/P');
      }
      for(const id of new Set(memberIds)){
        const original=catalog.cards.filter(card=>card.classification.rarity.mapping.value===rarity && w.canonicalMemberId(card)===id).map(card=>card.id);
        assert(JSON.stringify(displayedCards.filter(card=>w.canonicalMemberId(card)===id).map(card=>card.id))===JSON.stringify(original),'same member/rarity retains original card order');
      }
      const panel=w.document.querySelector('.catalogCard');
      assert(!/Lv|Bloom|特訓/.test(panel.querySelector('.canonicalSlotStatus').textContent.replace('Bloom','')), 'basic info has no growth metadata');
      const labels=panel.querySelectorAll('.canonicalGrowth .catalogStepper');
      assert(labels[0].textContent.startsWith('特訓') && labels[1].textContent.startsWith('開花'),'training then bloom');
      assert(labels[0].compareDocumentPosition(labels[1]) & w.Node.DOCUMENT_POSITION_FOLLOWING,'training before opening in DOM');
      const ptsLine=panel.querySelector('.catalogParameters');
      const totalLine=panel.querySelector('.catalogTotal');
      assert(/^P \d+ \/ T \d+ \/ S \d+$/.test(ptsLine.textContent),'PTS in one text row');
      assert(ptsLine.getClientRects().length===1,'PTS occupies one rendered line');
      assert(totalLine.getBoundingClientRect().top>=ptsLine.getBoundingClientRect().bottom,'TOTAL below PTS');
      assert(labels[0].getBoundingClientRect().top<=labels[1].getBoundingClientRect().top,'growth controls in reading order');
      const card=catalog.cards.find(c=>c.id===panel.dataset.cardId);
      const trainingSelect=panel.querySelector('[data-catalog-training]');
      const bloomSelect=panel.querySelector('[data-catalog-bloom]');
      for(const row of card.progression.trainingStages){
        input(w,'[data-catalog-training]',String(row.stage));
        const value=card.progression.statSnapshots.find(s=>s.level===row.levelCap).raw.parameterBaseValue;
        const expected=w.canonicalParameterText(w.calculateCardParameters(card,row.stage,Number(bloomSelect.value)));
        assert(panel.querySelector('.canonicalSlotStatus:last-child').textContent.replace('\nTOTAL ', ' / TOTAL ').includes(expected),'training stats UI ★'+rarity+' stage '+row.stage);
        for(const bloom of [0,2,5]){
          input(w,'[data-catalog-bloom]',String(bloom));
          assert(panel.querySelector('.canonicalSlotStatus:last-child').textContent.replace('\nTOTAL ', ' / TOTAL ').includes(w.canonicalParameterText(w.calculateCardParameters(card,row.stage,bloom))),'Bloom updates displayed parameters');
        }
      }
    }
    click(w,'[data-catalog-rarity="5"]');
    assert(visitedCards===185,'all 185 cards reachable by categories');
    input(w,'#catalogSearch','存在しないカード');assert(w.document.querySelectorAll('.catalogCard').length===0,'empty search');
    input(w,'#catalogSearch','サクラBloom');assert(w.document.querySelector('[data-catalog-bloom]').value==='5','filter retains saved opening');
    // Card user settings survive reload and ownership never gates growth editing.
    assert(!w.document.querySelector('[data-catalog-owned]').checked,'new cards default unowned');
    click(w,'[data-catalog-owned]');
    input(w,'[data-catalog-training]','2');input(w,'[data-catalog-bloom]','3');
    const ownedId=w.document.querySelector('.catalogCard').dataset.cardId;
    assert(w.getUserCardState(ownedId).owned===true,'ownership persisted');
    click(w,'[data-catalog-owned]');
    w=await open('card-catalog.html');watch(w);await w.eval('cardCatalogReady');input(w,'#catalogSearch','サクラBloom');
    assert(!w.document.querySelector('[data-catalog-owned]').checked && w.document.querySelector('[data-catalog-training]').value==='2' && w.document.querySelector('[data-catalog-bloom]').value==='3','unowned retains growth after reload');
    input(w,'[data-catalog-training]','3'); // remains usable while unowned
    click(w,'[data-catalog-owned]');
    w=await open('card-catalog.html');watch(w);await w.eval('cardCatalogReady');input(w,'#catalogSearch','サクラBloom');
    assert(w.document.querySelector('[data-catalog-owned]').checked && w.document.querySelector('[data-catalog-training]').value==='3' && w.document.querySelector('[data-catalog-bloom]').value==='3','owned and growth restored');
    const savedOwned=JSON.stringify(w.getUserCardState(ownedId));
    input(w,'#catalogSearch','ときのそら');
    click(w,'[data-catalog-owned]');input(w,'[data-catalog-training]','1');input(w,'[data-catalog-bloom]','1');
    assert(JSON.stringify(w.getUserCardState(ownedId))===savedOwned,'other card changes isolated');
    input(w,'#catalogSearch','サクラBloom');
    for(const [selector,max] of [['[data-catalog-training]',4],['[data-catalog-bloom]',5]]){
      input(w,selector,'0');
      const output=w.document.querySelector(selector),group=output.closest('.catalogStepper');
      const minus=group.querySelector('[data-step="-1"]'),plus=group.querySelector('[data-step="1"]');
      assert(minus.disabled && !plus.disabled,'minimum disables minus');minus.click();assert(output.value==='0','no underflow');
      input(w,selector,String(max));
      assert(plus.disabled && !minus.disabled,'maximum disables plus');plus.click();assert(output.value===String(max),'no overflow');
      assert(plus.getBoundingClientRect().width===28 && plus.getBoundingClientRect().height===31,'compact stepper button size');
    }
    const ownedCard=catalog.cards.find(card=>card.id===ownedId);
    const ownedExpansion=w.expandCanonicalBloom(ownedCard,5,catalog.dataset,4);
    const text=w.document.querySelector('.catalogCard .canonicalSlotStatus:last-child').textContent;
    assert(text.includes('SP Lv.2：') && text.includes('A Lv.2：') && text.includes('P Lv.2：'),'stepper updates skill levels');
    assert(text.replace('\nTOTAL ',' / TOTAL ').includes(w.canonicalParameterText(ownedExpansion.cardParameters)),'stepper updates exact parameters');
    const originalUpdate=w.updateUserCardState;
    w.updateUserCardState=()=>{throw Error('test quota');};
    click(w,'.catalogStepper [data-step="-1"]');
    assert(w.document.querySelector('[data-catalog-training]').value==='4' && w.document.querySelector('.catalogSaveStatus').textContent.includes('保存できません'),'failed save visible and control rolls back');
    w.updateUserCardState=originalUpdate;
    assert(JSON.stringify(Object.keys(localStorage).filter(k=>k!=='holodori-user-card-state-v1').sort().map(k=>[k,localStorage.getItem(k)]))===storageBeforeCatalog,'card library leaves all other storage untouched');
    assert(!w.performance.getEntriesByType('resource').some(r=>r.name.includes('/research/')),'card library loads no complete Canonical');
    input(w,'[data-catalog-training]','4');input(w,'[data-catalog-bloom]','3');
    const sharedParameterText=w.document.querySelector('.catalogCard .canonicalSlotStatus:last-child').textContent.replace('\nTOTAL ', ' / TOTAL ').split('\n')[0];
    w=await open('index.html');watch(w);await w.waitForCanonicalRestore();await w.loadRuntimeCardCatalog();
    click(w,'[data-load-canonical="0"]');await new Promise(resolve=>w.setTimeout(resolve,0));
    input(w,'[data-canonical-search]','サクラBloom');input(w,'[data-canonical-bloom]','3');input(w,'[data-canonical-training]','4');
    assert(w.document.querySelector('.canonicalCardChoiceControls .canonicalSlotStatus').textContent.split('\n')[0]===sharedParameterText,'A equals card library parameters');
    click(w,'#canonicalCardModal .canonicalCardChoiceControls button');
    w=await open('index.html');watch(w);await w.waitForCanonicalRestore();
    assert(w.document.querySelector('.card').canonicalExpansion.trainingStats.level===80,'A training restored');
    click(w,'[data-reset-slot="0"]');w=await open('index.html');watch(w);await w.waitForCanonicalRestore();
    assert(!w.document.querySelector('.card').canonicalSelection,'training reset persists');
    w=await open('event.html');watch(w);await w.loadEventSearchState();
    click(w,'.requiredSlot [data-load-canonical-slot="0"]');await new Promise(resolve=>w.setTimeout(resolve,0));
    input(w,'[data-canonical-training]','4');input(w,'[data-canonical-bloom]','3');click(w,'#canonicalCardModal .canonicalCardChoiceControls button');
    w=await open('event.html');watch(w);await w.loadEventSearchState();
    assert(w.document.querySelector('.requiredSlot .canonicalSlotStatus').textContent.includes(sharedParameterText),'B restored parameters equal card library and A');
    const beforeLeader=JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]));
    w=await open('leader.html');watch(w);await w.eval('leaderCatalogReady');
    const leaderData=await (await w.fetch('data/runtime-leader-skills.json')).json();
    assert(w.document.querySelectorAll('#leaderCards .leaderSkill').length===131,'all card leader rows');
    assert(w.document.querySelectorAll('#leaderCommon .leaderSkill').length===54,'common effects separate');
    for(const row of leaderData.cardSkills){
      const article=w.document.querySelector(`#leaderCards [data-card-id="${row.cardId}"]`);
      assert(article && article.querySelector('.leaderDescription').textContent===row.description.replace(/\[[^\]]+\]/g,''),'leader original description preserved');
      assert(w.document.querySelectorAll(`#leaderCards [data-card-id="${row.cardId}"]`).length===1,'each card exactly once');
      assert(article.closest('.leaderCategory').dataset.category===row.presentation.category,'effect category matches');
      const heading=article.closest('.leaderAmount').querySelector('h3').textContent;
      for(const effect of row.presentation.effects){
        assert(heading.includes(`${effect.amountPercent}%`),'every effect amount visible');
        if(row.presentation.effects.length>1) assert(heading.includes(effect.label),'both compound labels visible');
        if(effect.conditionText) assert(article.querySelector('.leaderIdentity').textContent.includes(effect.conditionText),'condition visible outside details');
      }

    }
    assert(!w.document.querySelector('#leaderCards').textContent.includes('全員の全パラメータが15%UP'),'default effect not auto assigned');
    assert(!w.performance.getEntriesByType('resource').some(r=>r.name.includes('/research/')),'leader loads only derived data');
    assert(JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]))===beforeLeader,'leader page does not write storage');
    assert(errors.length===0,errors.join('\n'));
    result.textContent='PASS: startup, timeline, save/edit/load, metadata, derived values, star3 presets, bloom independence, event v2, formations, snapshot, support rates, manual skills, Bloom 0–5 A/B persistence/reset, card catalog search/filter/isolation';
  } catch(e){ result.textContent='FAIL: '+e.stack; }
  finally {
    localStorage.clear(); for(const [k,v] of backup) localStorage.setItem(k,v);
  }
})();
</script>
