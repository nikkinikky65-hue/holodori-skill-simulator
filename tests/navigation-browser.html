<!doctype html><meta charset="utf-8"><title>Global navigation regression</title>
<pre id="result">RUNNING</pre><iframe id="page" style="height:750px;border:0"></iframe>
<script>
(async()=>{
  const result=document.querySelector('#result'),frame=document.querySelector('#page');
  const assert=(ok,message)=>{if(!ok)throw Error(message);};
  const pages=['index.html','library.html','card-catalog.html','leader.html','event.html','unit-simulator.html'];
  const labels=['A','ライブラリ','カード','リーダー','イベント編成探索','開発中'];
  const backup=new Map(Object.keys(localStorage).map(key=>[key,localStorage.getItem(key)]));
  const open=path=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);frame.src='../'+path;});
  const follow=link=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);link.click();});
  async function inspect(w,page,width){
    if(page==='card-catalog.html') await w.eval('cardCatalogReady');
    if(page==='leader.html') await w.eval('leaderCatalogReady');
    if(page==='index.html') await w.waitForCanonicalRestore();
    if(page==='unit-simulator.html') await w.eval('unitSimulatorReady');
    const nav=w.document.querySelector('.globalNav');
    const links=[...nav.querySelectorAll('a')];
    assert(JSON.stringify(links.map(a=>a.textContent))===JSON.stringify(labels),'six labels');
    assert(JSON.stringify(links.map(a=>new URL(a.href).pathname.split('/').pop()))===JSON.stringify(pages),'six targets');
    assert(links.filter(a=>a.getAttribute('aria-current')==='page').length===1,'one active tab');
    assert(new URL(nav.querySelector('[aria-current]').href).pathname.endsWith(page),'active page correct');
    assert(!w.document.querySelector('main .globalNav'),'navigation outside feature UI');
    assert(w.getComputedStyle(nav).overflowX==='auto','horizontal scrolling');
    assert(links.every(a=>w.getComputedStyle(a).whiteSpace==='nowrap'),'labels do not wrap');
    assert(links.every(a=>Math.abs(a.getBoundingClientRect().top-links[0].getBoundingClientRect().top)<1),'tabs in one row');
    assert(w.document.querySelector('.siteHeader').getBoundingClientRect().width<=width+1,'header fits viewport');
    if(width===360){
      assert(nav.scrollWidth>nav.clientWidth,'narrow tabs scroll');
      const active=nav.querySelector('[aria-current]').getBoundingClientRect(),box=nav.getBoundingClientRect();
      assert(active.left>=box.left-1 && active.right<=box.right+1,'active tab visible on mobile');
    }else assert(nav.scrollWidth===nav.clientWidth,'desktop tabs fit');
    if(page==='index.html') assert(w.document.querySelectorAll('#cards .card').length===5,'A starts');
    if(page==='index.html'){
      const panel=w.document.querySelector('#randomSimulation');
      panel.querySelector('select').value='100';panel.querySelector('button').click();
      assert(panel.querySelectorAll('[data-random-metric]').length===7,'random simulation starts');
      const box=panel.getBoundingClientRect();
      assert(box.width<=width && panel.scrollWidth<=panel.clientWidth,'random panel fits');
    }
    if(page==='library.html') assert(w.document.querySelector('#cardTalent').options.length>50,'registration starts');
    if(page==='card-catalog.html') assert(w.document.querySelectorAll('.catalogCard').length===77 && !w.document.querySelector('#catalogStatus').dataset.errorKind,'catalog starts');
    if(page==='card-catalog.html'){
      const panel=w.document.querySelector('.catalogCard');
      for(const button of panel.querySelectorAll('.catalogStepper button')){
        const box=button.getBoundingClientRect(), card=panel.getBoundingClientRect();
        assert(box.width===28 && box.height===31,'compact stepper dimensions');
        assert(box.left>=card.left && box.right<=card.right,'stepper stays inside card');
      }
      const output=panel.querySelector('[data-catalog-training]');
      const plus=output.closest('.catalogStepper').querySelector('[data-step="1"]');
      plus.click();assert(output.value==='1','responsive stepper works');
      output.closest('.catalogStepper').querySelector('[data-step="-1"]').click();
      assert(output.value==='0','responsive stepper restores');
    }
    if(page==='leader.html') assert(w.document.querySelectorAll('#leaderCards .leaderSkill').length===131 && !w.document.querySelector('#leaderStatus').dataset.error,'leader starts');
    if(page==='leader.html'){
      assert(w.document.documentElement.scrollWidth<=width,'leader body has no horizontal overflow');
      const groups=[...w.document.querySelectorAll('.leaderCategory')];
      assert(groups.length===6,'six effect categories');
      for(const group of groups){
        if(group.dataset.category!=='複合効果'){
          const amounts=[...group.querySelectorAll('.leaderAmount h3')].map(h=>parseInt(h.textContent));
          assert(amounts.every((v,i)=>!i||amounts[i-1]>=v),'amounts descending');
        }
      }
      assert(w.document.querySelectorAll('[data-category="複合効果"] .leaderEntry').length===16,'all compound leaders');
      assert(w.document.querySelectorAll('#leaderCommon .leaderSkill').length===54,'common effects unchanged');
      for(const amount of w.document.querySelectorAll('.leaderAmount')){
        const summary=amount.querySelector(':scope > summary');
        const members=[...amount.querySelectorAll('.leaderEntry')];
        const child=members[0].querySelector('details');
        assert(amount.tagName==='DETAILS' && amount.open,'amount initially open');
        assert(members.every(member=>member.checkVisibility()),'all members visible');
        child.querySelector('summary').click();
        assert(child.open && amount.open,'inner disclosure independent');
        summary.click();
        assert(!amount.open && members.every(member=>!member.checkVisibility()),'whole amount hidden');
        summary.click();
        assert(amount.open && members.every(member=>member.checkVisibility()),'all members restored');
        assert(child.open && child.querySelector('.leaderDescription').getBoundingClientRect().height>0,'inner state retained');
        child.querySelector('summary').click();
        assert(!child.open && amount.open,'inner closes independently');
      }
      const details=w.document.querySelector('.leaderEntry details'); details.querySelector('summary').click();
      assert(details.open && details.querySelector('.leaderDescription').getBoundingClientRect().height>0,'original text opens');
      assert(w.document.documentElement.scrollWidth<=width,'expanded description fits');
    }
    if(page==='event.html') assert(w.document.querySelector('#searchFormation') && w.document.querySelector('.requiredSlot'),'event starts');
  }
  try{
    for(const width of [1100,360]){
      frame.style.width=width+'px';
      for(const source of pages){
        let w=await open(source);await inspect(w,source,width);
        for(const target of pages){
          w=await follow([...w.document.querySelectorAll('.globalNav a')].find(a=>new URL(a.href).pathname.endsWith(target)));
          await inspect(w,target,width);
        }
      }
    }
    frame.style.width='360px';
    const w=await open('./');await inspect(w,'index.html',360);
    result.textContent='PASS: six routes, all tabs, active state, desktop/mobile geometry, active visibility, feature startup and root alias';
  }catch(error){result.textContent='FAIL: '+error.stack;}
  finally{localStorage.clear();for(const [key,value] of backup)localStorage.setItem(key,value);}
})();
</script>
