<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe style="border:0;height:900px"></iframe>
<script>
(async()=>{
 const out=document.querySelector('#result'),frame=document.querySelector('iframe'),check=(v,m)=>{if(!v)throw Error(m);},tick=()=>new Promise(r=>setTimeout(r,60)),measurements=[];
 try{
  for(const width of [1280,768,390]){
   frame.style.width=width+'px';frame.src='../card-catalog.html';await new Promise(r=>frame.onload=r);
   const w=frame.contentWindow,d=w.document;await w.eval('cardCatalogReady');check(!d.querySelector('#catalogStatus').dataset.errorKind,'initialized');
   const catalog=await w.loadRuntimeCardCatalog(),root=d.querySelector('#catalogStats'),mode=v=>d.querySelector('[data-catalog-view="'+v+'"]').click();
   const rows=()=>[...root.querySelectorAll('tbody tr')],ids=()=>rows().map(r=>r.dataset.cardId);
   const initial=d.querySelector('.catalogCard').dataset.cardId;w.updateUserCardState(initial,{owned:true,training:2,opening:3});const stored=JSON.stringify(w.localStorage);
   mode('status');check(!root.hidden&&d.querySelector('#catalogSP').hidden&&d.querySelector('#catalogCards').hidden,'exclusive status view');
   const growth=root.querySelector('[data-sp-growth]'),opening=root.querySelector('[data-sp-custom]'),training=root.querySelector('[data-comparison-training]');
   const set=(n,v)=>{n.value=v;n.dispatchEvent(new w.Event('change'));};
   for(const rarity of [5,4,3]){
    d.querySelector('[data-catalog-rarity="'+rarity+'"]').click();
    for(const policy of ['initial','saved','max','custom']){
     set(growth,policy);if(policy==='custom'){set(opening,'max');set(training,'saved');}
     check(rows().length===catalog.cards.filter(c=>c.classification.rarity.mapping.value===rarity).length,'all cards per rarity');
     for(const tr of rows()){
      const card=catalog.cards.find(c=>c.id===tr.dataset.cardId),expected=w.eval('CatalogStatusData').project(card,w.getUserCardState(card.id,w.readUserCardStates()),policy,opening.value,training.value);
      check(tr.cells.length===7,'seven columns');
      check(tr.querySelector('[data-sp-field="passive"]').textContent===(expected.passive.map(e=>e.text).join('')||'—'),'full Passive text at selected level');
      check(!/\[(?:attribute=|\/attribute|highlight|\/highlight)/.test(tr.querySelector('[data-sp-field="passive"]').textContent),'no internal decoration tags');
      for(const key of ['performance','technique','sense','total'])check(tr.querySelector('[data-sp-field="'+key+'"]').textContent===expected[key][0].text,'rendered stat '+key);
     }
    }
   }
   d.querySelector('[data-catalog-rarity="5"]').click();
   const baseline=w.sortCatalogCardsForDisplay(catalog.cards.filter(c=>c.classification.rarity.mapping.value===5)).map(c=>c.id);
   for(const key of ['performance','technique','sense','total'])for(const dir of [-1,1]){
    root.querySelector('[data-sp-sort="'+key+'"]').click();const nums=rows().map(r=>Number(r.querySelector('[data-sp-field="'+key+'"]').textContent.replaceAll(',','')));
    check(nums.every((n,i)=>!i||dir*(n-nums[i-1])>=0),'numeric sort '+key);
    check(nums.every((n,i)=>!i||n!==nums[i-1]||baseline.indexOf(ids()[i-1])<baseline.indexOf(ids()[i])),'equal values retain catalog order');
   }
   for(const dir of [-1,1]){root.querySelector('[data-sp-sort="name"]').click();const cards=catalog.cards.filter(c=>c.classification.rarity.mapping.value===5);const expected=w.eval('CatalogComparisonOrder').sortByAffiliation(cards,dir).map(c=>c.id);check(JSON.stringify(ids())===JSON.stringify(expected),'shared affiliation sort');}
   // Filters are independent of mode and retain the same matching card set.
   d.querySelector('#catalogTalentFilter button').click();const td=d.querySelector('.talentFilterDialog');td.querySelector('[data-talent-id="sakura_miko"]').click();td.querySelector('[data-talent-apply]').click();
   d.querySelector('#catalogSkillFilter button').click();const sd=d.querySelector('.skillFilterDialog');sd.querySelector('[data-skill-axis="targets"][value="affiliation"]').click();sd.querySelector('[data-skill-apply]').click();
   const search=d.querySelector('#catalogSearch');search.value='みこ';search.dispatchEvent(new w.Event('input'));set(d.querySelector('#catalogType'),'cute');
   const expected=catalog.cards.filter(c=>c.classification.rarity.mapping.value===5&&c.member.mapping.id==='sakura_miko'&&c.classification.attributeType.mapping.value==='cute'&&w.eval('PassiveSkillFilter').matches(c,{condition:'',targets:['affiliation'],effects:[]})).map(c=>c.id).sort();
   check(JSON.stringify(ids().sort())===JSON.stringify(expected),'all filters AND');mode('sp');check(JSON.stringify([...d.querySelectorAll('#catalogSP tbody tr')].map(r=>r.dataset.cardId).sort())===JSON.stringify(expected),'SP matching set');mode('detail');check(JSON.stringify([...d.querySelectorAll('.catalogCard')].map(r=>r.dataset.cardId).sort())===JSON.stringify(expected),'detail matching set');mode('status');check(growth.value==='custom'&&training.value==='saved','growth state retained');
   d.querySelector('#catalogTalentFilter button').click();td.querySelector('[data-talent-clear]').click();td.querySelector('[data-talent-apply]').click();d.querySelector('#catalogSkillFilter button').click();sd.querySelector('[data-skill-clear]').click();sd.querySelector('[data-skill-apply]').click();search.value='';search.dispatchEvent(new w.Event('input'));set(d.querySelector('#catalogType'),'');
   await tick();const scroll=root.querySelector('.catalogSPScroll'),head=scroll.querySelector('thead'),nav=d.querySelector('.siteHeader');check(scroll.scrollHeight===scroll.clientHeight,'page-only vertical scroll');
   const x=rows()[0].cells[1].getBoundingClientRect().left;scroll.scrollLeft=999;await tick();check(Math.abs(rows()[0].cells[1].getBoundingClientRect().left-x)<1,'fixed name column');
   w.scrollTo(0,w.scrollY+head.getBoundingClientRect().top-nav.getBoundingClientRect().bottom+100);w.dispatchEvent(new w.Event('scroll'));await tick();
   const floating=root.querySelector('.catalogSPFloating');check(!floating.hidden&&Math.abs(floating.getBoundingClientRect().top-nav.getBoundingClientRect().bottom)<1,'fixed header below nav');check(floating.scrollLeft===scroll.scrollLeft,'header synced');
   floating.querySelector('[data-sp-sort="total"]').click();await tick();check(scroll.querySelector('[data-sp-sort="total"]').parentElement.getAttribute('aria-sort')==='descending','fixed header sort');
   check(d.documentElement.scrollWidth<=width,'page fits');if(width===1280)check(scroll.scrollWidth===scroll.clientWidth,'desktop fits');
   measurements.push({width,table:scroll.querySelector('table').getBoundingClientRect().width,horizontal:scroll.scrollWidth-scroll.clientWidth});
   check(JSON.stringify(w.localStorage)===stored,'no storage writes');mode('detail');await tick();check(d.querySelector('main').getBoundingClientRect().width<=1180&&floating.hidden,'detail restored');mode('status');root.scrollIntoView();w.dispatchEvent(new w.Event('scroll'));await tick();
  }
  out.textContent='PASS: 201 cards, seven columns, growth, custom, stats, sort, AND filters, shared SP/detail selection, fixed header/columns, read-only, 1280/768/390 '+JSON.stringify(measurements);
 }catch(e){out.textContent='FAIL: '+e.stack;}
})();
</script>
