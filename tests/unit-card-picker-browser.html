<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe style="height:800px;border:0"></iframe>
<script>
(async()=>{
 const out=document.querySelector('#result'),frame=document.querySelector('iframe');
 const check=(ok,message)=>{if(!ok)throw Error(message);};
 try{
  for(const width of [1100,360]){
   frame.style.width=width+'px';
   const w=await new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);frame.src='../unit-simulator.html?picker-test='+width;});
   const api=await w.eval('unitSimulatorReady'),catalog=await w.loadRuntimeCardCatalog();
   const byId=new Map(catalog.cards.map(card=>[card.id,card]));
   const controls=[...w.document.querySelectorAll('[data-unit-card]')];
   const members=[...w.document.querySelectorAll('[data-unit-member]')];
   check(controls.length===5&&members.length===5,'five card and member controls');
   for(const filters of w.document.querySelectorAll('.unitCardFilters')){
    const search=filters.querySelector('input[type=search]'),member=filters.querySelector('[data-unit-member]');
    const searchBox=search.getBoundingClientRect(),memberBox=member.getBoundingClientRect();
    check(Math.abs(searchBox.top-memberBox.top)<2&&searchBox.right<=memberBox.left,'filters share one row');
    check(searchBox.width>memberBox.width,'search wider than member');
    check(memberBox.right<=width,'filter row fits');
   }
   const fullOrder=[...controls[0].options].map(o=>o.value).filter(Boolean);
   check(fullOrder.length===196,'all cards');
   check(fullOrder.every((id,i)=>i===0||byId.get(fullOrder[i-1]).classification.rarity.mapping.value>=byId.get(id).classification.rarity.mapping.value),'rarity order');
   for(const rarity of [5,4,3]){
    const expected=w.sortCatalogCardsForDisplay(catalog.cards).filter(card=>card.classification.rarity.mapping.value===rarity).map(card=>card.id);
    check(JSON.stringify(fullOrder.filter(id=>byId.get(id).classification.rarity.mapping.value===rarity))===JSON.stringify(expected),'member/card order '+rarity);
   }
   const target=catalog.cards.find(card=>card.member.name==='星街すいせい');
   const memberId=w.canonicalMemberId(target);
   for(let i=0;i<5;i++){
    const member=members[i],choice=controls[i],search=choice.closest('.unitSlot').querySelector('input[type=search]');
    check([...member.options].some(o=>o.value===memberId),'dynamic member '+i);
    member.value=memberId;member.dispatchEvent(new w.Event('change'));
    check([...choice.options].filter(o=>o.value).every(o=>w.canonicalMemberId(byId.get(o.value))===memberId),'member filter '+i);
    search.value='一致しない';search.dispatchEvent(new w.Event('input'));
    check(choice.options.length===1,'combined empty '+i);
    search.value='星街すいせい';search.dispatchEvent(new w.Event('input'));
    check(choice.options.length>1,'combined match '+i);
    choice.value=target.id;choice.dispatchEvent(new w.Event('change'));
    check(api.capture().slots[i].cardId===target.id && api.getModel().members[i].card.id===target.id,'formation selection '+i);
    member.value='';member.dispatchEvent(new w.Event('change'));search.value='';search.dispatchEvent(new w.Event('input'));
    check(choice.options.length===197,'clear filters '+i);
    check(choice.getBoundingClientRect().right<=width&&member.getBoundingClientRect().right<=width,'controls fit '+i);
   }
   check(w.document.documentElement.scrollWidth<=width,'page width');
  }
  out.textContent='PASS: five slots, combined search, rarity/member order, formation update, 1100/360';
 }catch(error){out.textContent='FAIL: '+error.stack;}
})();
</script>
