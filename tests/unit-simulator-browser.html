<!doctype html><meta charset="utf-8"><title>Unit simulator regression</title>
<pre id="result">RUNNING</pre><iframe id="page" style="height:800px;border:0"></iframe><iframe id="stable" style="display:none"></iframe>
<script>
(async()=>{
 const result=document.querySelector('#result'),frame=document.querySelector('#page');
 const backup=new Map(Object.keys(localStorage).map(key=>[key,localStorage.getItem(key)]));
 const assert=(ok,message)=>{if(!ok)throw Error(message);};
 const open=()=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);frame.src='../unit-simulator.html';});
 try{
  const stable=document.querySelector('#stable');
  await new Promise(resolve=>{stable.onload=resolve;stable.src='../index.html';});
  const a=stable.contentWindow;await a.waitForCanonicalRestore();
  const saved=JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]));
  const timeline=a.document.querySelector('#timeline').innerHTML;
  for(const width of [1100,360]){
   frame.style.width=width+'px';const w=await open();const api=await w.eval('unitSimulatorReady');
   const select=[...w.document.querySelectorAll('[data-unit-card]')];
   assert(select.length===5 && select[0].options.length===186,'185 cards / five slots');
   assert(w.document.querySelector('#unitRun').disabled,'incomplete cannot run');
   select[0].selectedIndex=1;select[0].dispatchEvent(new w.Event('change'));
   const firstPreview=w.document.querySelector('.unitPreview');
   assert(firstPreview.textContent.includes('SP：') && !firstPreview.textContent.includes('使用Lv'),'one selected card renders skills without level summary');
   assert(!w.document.querySelector('#unitSlots').textContent.includes('使用Lv'),'no level summary in card DOM');
   for(let i=0;i<5;i++){select[i].selectedIndex=i+1;select[i].dispatchEvent(new w.Event('change'));}
   for(const [field,value] of [['training','4'],['bloom','3']]){
    for(const control of w.document.querySelectorAll(`[data-${field}]`)){control.value=value;control.dispatchEvent(new w.Event('change'));}
   }
   let model=api.getModel();
   assert(model.members.every(m=>m.expansion.levels.active===2 && m.expansion.levels.special===2 && m.expansion.levels.passive===1),'bloom P/A/SP');
   assert(model.members.every(m=>m.parameters.training===4),'training retained');
   for(const member of model.activeMembers){
    assert(JSON.stringify(a.events(member,120))===JSON.stringify(w.eval('ActiveTimelineEngine').events(member,120)),'A event parity');
    assert(a.adjustedInterval(member)===w.eval('ActiveTimelineEngine').adjustedInterval(member),'A frequency parity');
   }
   const all=model.eventsByMember.flat();
   assert(JSON.stringify(a.maxSegments(all,120))===JSON.stringify(model.segments),'A duration/overlap parity');
   assert(Math.abs(model.activeOnlyX-(120+a.calcMax(all,120)/100))<1e-9,'A integral parity');
   assert(w.document.querySelector('#unitParameters').textContent.includes('開花増分') && w.document.querySelector('#unitParameters').textContent.includes('現在計算値'),'breakdown visible');
   w.document.querySelector('#unitTrials').value='100';w.document.querySelector('#unitRun').click();
   assert(w.document.querySelector('#unitResultStatus').textContent.includes('100試行完了'),'simulation works');
   assert(!w.document.querySelector('#unitResult').textContent.includes('X'),'numeric result');
   assert(w.document.documentElement.scrollWidth<=width,'page fits width');
   assert(w.document.querySelector('#unitSlots').scrollWidth<=w.document.querySelector('#unitSlots').clientWidth,'slots fit width');
   const duration=w.document.querySelector('#unitDuration');duration.value='90';duration.dispatchEvent(new w.Event('input'));
   assert(api.getModel().duration===90 && !w.document.querySelector('#unitResult').textContent,'duration invalidates results');
   const spBefore=JSON.stringify(api.getModel().specialSchedule),scoreBefore=api.getModel().allSuccessScore;
   const activeBars=[...w.document.querySelectorAll('#unitTimeline .row:not(.maxrow) .bar')].map(b=>b.outerHTML).join('');
   assert(w.document.querySelectorAll('#unitTimeline .spInterval').length===5,'five SP backgrounds in member rows');
   const showSP=w.document.querySelector('#unitShowSP');showSP.checked=false;showSP.dispatchEvent(new w.Event('change'));
   assert([...w.document.querySelectorAll('.spInterval')].every(e=>!e.checkVisibility()),'SP backgrounds hide');
   assert(JSON.stringify(api.getModel().specialSchedule)===spBefore && api.getModel().allSuccessX===api.getModel().activeOnlyX,'OFF retains schedule and restores Active-only calculation');
   assert(api.getModel().passiveSupport.status==='disabled' && api.getModel().supportTrace.intervals.length===0,'OFF skips all Support');
   assert(!w.document.querySelector('.spBackground'),'OFF removes all SP bands');
   assert([...w.document.querySelectorAll('#unitTimeline .row:not(.maxrow) .bar')].map(b=>b.outerHTML).join('')===activeBars,'Active bars unchanged when hidden');
   showSP.checked=true;showSP.dispatchEvent(new w.Event('change'));
   assert([...w.document.querySelectorAll('.spInterval')].every(e=>e.checkVisibility()),'SP backgrounds show');
   assert(JSON.stringify(api.getModel().specialSchedule)===spBefore&&api.getModel().allSuccessScore===scoreBefore,'ON restores schedule and score');
   const tracks=[...w.document.querySelectorAll('#unitTimeline .track')];
   const track=tracks[0].getBoundingClientRect(),last=tracks[5].getBoundingClientRect();
   for(const [i,band] of [...w.document.querySelectorAll('.spInterval')].entries()){
     const box=band.getBoundingClientRect(),sp=api.getModel().specialSchedule.entries[i];
     assert(box.top<=track.top&&box.bottom>=last.bottom,'band spans all six rows');
     assert(Math.abs(box.left-(track.left+sp.start/api.getModel().duration*track.width))<1,'band time position');
     assert(Math.abs(box.width-sp.duration/api.getModel().duration*track.width)<1,'band duration width');
     assert(w.getComputedStyle(band).pointerEvents==='none','band cannot intercept clicks');
   }

   const scheduleControl=w.document.querySelector('[data-sp-slot="1"]');
   scheduleControl.closest('details').open=true;
   scheduleControl.value='1000';scheduleControl.dispatchEvent(new w.Event('change'));
   const moved=api.getModel().specialSchedule.entries;
   assert(moved[0].placement==='manual'&&moved.every((sp,i)=>sp.end<=90&&(!i||sp.start>=moved[i-1].end)),'manual move bounded and nonoverlapping');
   const manualSchedule=JSON.stringify(api.getModel().specialSchedule);
   showSP.checked=false;showSP.dispatchEvent(new w.Event('change'));
   showSP.checked=true;showSP.dispatchEvent(new w.Event('change'));
   assert(JSON.stringify(api.getModel().specialSchedule)===manualSchedule,'manual placement survives OFF/ON');
   const supportDetails=w.document.querySelector('#unitSupportTrace').closest('details');supportDetails.open=true;
   assert(w.document.querySelector('#unitSupportTrace').textContent.includes('overlapIntervals'),'SP overlap trace visible');
   assert(w.document.documentElement.scrollWidth<=width,'SP inputs/trace fit');
   supportDetails.open=false;

   const query=w.document.querySelector('.unitSlot input[type=search]');query.value='存在しない検索';query.dispatchEvent(new w.Event('input'));
   assert(select[0].options.length===2 && select[0].value===model.members[0].card.id,'search retains selection');
   assert(JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]))===saved,'no writes to existing storage');
   assert(a.document.querySelector('#timeline').innerHTML===timeline,'stable A untouched');
   query.value='';query.dispatchEvent(new w.Event('input'));
   for(const control of select){control.value='card-00022-3-nrml-0018-00';control.dispatchEvent(new w.Event('change'));}
   for(const control of w.document.querySelectorAll('[data-bloom]')){control.value='4';control.dispatchEvent(new w.Event('change'));}
   assert(api.getModel().parameters.passive.total>0,'real Noel self Passive applies');
   assert(w.document.querySelector('#unitParameters').textContent.includes('Passive合計'),'Passive aggregate visible');
   const trace=w.document.querySelector('#unitParameters details');trace.querySelector('summary').click();
   assert(trace.open && trace.textContent.includes('referenceValue'),'trace expands');
   assert(w.document.documentElement.scrollWidth<=width,'trace fits viewport');
   assert(!w.document.querySelector('#unitMemoryKind, [data-total-adjustment], [data-short]'),'removed inputs have no stale DOM');
   const current=api.getModel();
   assert(current.parameters.memory.status==='unset'&&current.parameters.enhancementBonus.status==='unset','removed controls preserve unset state');
   assert(current.activeMembers.every(m=>m.short===0),'frequency default unchanged');
   assert(current.parameters.members.every(m=>m.board.status==='unset'&&m.costume.status==='unset'),'external totals stay unset');
   assert(!w.document.querySelector('#unitParameters table').textContent.match(/Memory|Enhancement|Board|衣装/),'unused breakdowns omitted');
   assert(trace.textContent.includes('memoryIncluded'),'full internal trace retained');
   assert(current.unitScore.value===current.parameters.subtotal.total && current.unitScore.hasUnresolved,'numeric provisional total with unknowns');
   for(const id of ['unitMemoryPercent','unitEnhancementPercent']){
     const old=api.getModel().unitScore.value,input=w.document.getElementById(id);
     input.value='6.4';input.dispatchEvent(new w.Event('input'));
     assert(api.getModel().unitScore.value>old && api.getModel().unitScore.value===api.getModel().parameters.subtotal.total,'input flows through parameter total');
   }
   assert(w.document.querySelector('#unitTimeline .axis') && w.document.querySelectorAll('#unitTimeline .row').length===6,'A Timeline structure');
   const bar=w.document.querySelector('#unitTimeline .bar');bar.click();
   assert(w.document.querySelector('#unitTimelineDetail').textContent.includes('有効補正'),'shared bar details');

   for(const control of select){control.value='card-00001-5-uniq-0000-00';control.dispatchEvent(new w.Event('change'));}
   assert(api.getModel().parameters.members[0].trace[0].condition.actualCount===5,'affiliation data loaded');
   assert(api.getModel().parameters.members[0].trace[0].status==='resolved','self affiliation Passive connected');
   assert(w.document.querySelector('#unitParameters').textContent.includes('affiliationId'),'affiliation trace visible');
   for(let i=0;i<select.length;i++){
     select[i].value=i<2?'card-00006-5-uniq-0007-00':'card-00001-5-uniq-0000-00';select[i].dispatchEvent(new w.Event('change'));
   }
   assert(api.getModel().parameters.members[0].trace[0].targetSlots.length===2,'partial target exact pair');
   select[2].value='card-00006-5-uniq-0007-00';select[2].dispatchEvent(new w.Event('change'));
   assert(api.getModel().parameters.members[0].trace[0].status==='unresolved','three candidates deferred');
   const targetTrace=w.document.querySelector('#unitParameters details');targetTrace.open=true;
   assert(targetTrace.textContent.includes('target selection unresolved'),'target reason visible');
   assert(w.document.documentElement.scrollWidth<=width,'target trace fits');
   for(const control of select){control.value='card-00001-3-nrml-0000-00';control.dispatchEvent(new w.Event('change'));}
   const attributeTrace=api.getModel().parameters.members[0].trace[0];
   assert(attributeTrace.targetResolution.selection.rule==='attribute-baseTotal','attribute selection connected');
   assert(attributeTrace.targetSlots.length===3,'attribute selects three');
   const expanded=w.document.querySelector('#unitParameters details');expanded.open=true;
   assert(expanded.textContent.includes('formationIndex')&&expanded.textContent.includes('baseTotal'),'selection trace visible');
   assert(w.document.documentElement.scrollWidth<=width,'attribute trace fits');
   const reloaded=await open();await reloaded.eval('unitSimulatorReady');
   assert([...reloaded.document.querySelectorAll('[data-unit-card]')].every(s=>s.value===''),'page-local selection resets on reload');
  }
  result.textContent='PASS: five slots, 185 cards, growth/skills, breakdown, A Timeline parity, simulation, storage isolation, reload, 1100px/360px';
 }catch(error){result.textContent='FAIL: '+error.stack;}
 finally{localStorage.clear();for(const [key,value] of backup)localStorage.setItem(key,value);}
})();
</script>
