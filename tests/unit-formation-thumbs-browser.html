<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe style="border:0;height:1200px"></iframe>
<script>
(async()=>{
const out=document.querySelector('pre'),frame=document.querySelector('iframe'),key='holodori-unit-formations-v1',backup=localStorage.getItem(key);
const check=(ok,msg)=>{if(!ok)throw Error(msg)};
const wait=async(fn)=>{for(let i=0;i<200;i++){if(fn())return;await new Promise(r=>setTimeout(r,25));}throw Error('image timeout')};
try{
localStorage.removeItem(key);frame.style.width='1100px';frame.src='../unit-formations.html';await new Promise(r=>frame.onload=r);
const w=frame.contentWindow;await w.eval('unitFormationsReady');const store=w.eval('UnitFormationStore'),resolver=w.eval('CardImageResolver');
const catalog=await(await fetch('../data/runtime-cards.json')).json();const mapped=catalog.cards.filter(c=>resolver.candidates(c.id).some(x=>x.kind==='thumb')).slice(0,5);
const original=resolver.candidates;resolver.candidates=id=>original(id).map(c=>({...c,url:c.url+(id===mapped[1].id?'':'?image-test=thumb')}));
const snapshot={version:1,slots:[mapped[0].id,mapped[1].id,'','missing-card',mapped[4].id].map(cardId=>({cardId,training:0,bloom:0,short:0,totalAdjustments:{board:{kind:'external-total',value:null},costume:{kind:'external-total',value:null}}})),leaderId:'',duration:'120',memoryPercent:'6.4',enhancementPercent:'2.43',trials:'100',specialEnabled:true,specialStarts:{}};
const saved=store.save('画像検証',snapshot);const before=localStorage.getItem(key);
w.dispatchEvent(new w.StorageEvent('storage',{key}));
const cells=()=>[...w.document.querySelectorAll('.formationThumb')];
await wait(()=>cells()[0]?.querySelector('img')?.style.visibility==='visible'&&!cells()[1]?.querySelector('img')&&cells()[4]?.querySelector('img')?.style.visibility==='visible');
check(cells().length===5&&cells().map(c=>c.dataset.slot).join()==='1,2,3,4,5','five slots in order');
check(cells()[2].textContent==='未設定'&&cells()[3].textContent==='画像なし'&&cells()[1].textContent==='画像なし','empty unknown failed labels');
check([0,4].every(i=>cells()[i].querySelector('img').src===new URL(resolver.candidates(mapped[i].id).find(c=>c.kind==='thumb').url,w.document.baseURI).href),'image identity matches each slot Thumb URL');
check(w.document.querySelector('.formationThumbs').compareDocumentPosition(w.document.querySelector('.formationMembers')) & 4,'images above member text');
for(const width of [1920,1280,768,390,360]){
 frame.style.width=width+'px';await new Promise(r=>setTimeout(r,50));const boxes=cells().map(c=>c.getBoundingClientRect());
 check(boxes.every(b=>Math.abs(b.width-b.height)<1),'squares including missing');
 check(boxes.every(b=>Math.abs(b.top-boxes[0].top)<1),'five columns no wrapping');
 check(w.document.documentElement.scrollWidth<=width,'no page overflow');
 check(w.document.querySelector('.formationThumbs').getBoundingClientRect().width<=560.1,'max width');
}
frame.style.width='1280px';await new Promise(r=>setTimeout(r,50));w.document.getElementById('formationCards').style.setProperty('--formation-thumbs-max-width','420px');
check(Math.abs(w.document.querySelector('.formationThumbs').getBoundingClientRect().width-420)<1,'single max-width variable');
check(w.getComputedStyle(cells()[0].querySelector('img')).objectFit==='contain','contain');
check(localStorage.getItem(key)===before,'image loading does not change stored snapshots');
const requests=w.performance.getEntriesByType('resource').filter(r=>r.initiatorType==='img');
check(requests.length>=3&&requests.every(r=>r.name.includes('/cards/thumb/')),'Thumb only; no thin/full attempts');
check(!requests.some(r=>r.name.includes('missing-card')),'unknown has no inferred URL');
let panel=w.document.querySelector('.savedFormation');w.prompt=()=> '画像検証コピー';panel.querySelectorAll('button')[1].click();
check(store.read().formations.length===2&&JSON.stringify(store.read().formations[1].snapshot)===JSON.stringify(snapshot),'duplicate snapshot intact');
w.confirm=()=>true;w.document.querySelectorAll('.savedFormation')[1].querySelectorAll('button')[2].click();check(store.read().formations.length===1,'delete');
check(w.document.querySelector('.formationActions a').getAttribute('href')==='unit-simulator.html?formation='+encodeURIComponent(saved.id),'load link unchanged');
// All success / partial failure / all failure: text visibility is independent per slot.
const allSnapshot=JSON.parse(JSON.stringify(snapshot));allSnapshot.slots.forEach((slot,i)=>{slot.cardId=mapped[i].id;slot.training=4;slot.bloom=5;});
const rules=await(await fetch('../data/leader-parameter-rules.json')).json();
allSnapshot.leaderId=rules.leaders.find(l=>l.effects.some(e=>e.parameter==='all_parameter'&&e.condition.type==='not_stated')).id;
allSnapshot.slots.forEach((slot,i)=>{slot.totalAdjustments={board:{kind:'external-total',value:100+i},costume:{kind:'external-total',value:200+i}};});
const simulator=document.createElement('iframe');simulator.style.display='none';document.body.append(simulator);simulator.src='../unit-simulator.html';await new Promise(r=>simulator.onload=r);
const sim=await simulator.contentWindow.eval('unitSimulatorReady');sim.restore(allSnapshot);
const expected=sim.getModel().members.map(member=>member.parameters.subtotal.total);
store.save('画像検証',allSnapshot,saved.id);const stored=localStorage.getItem(key);
for(const successful of [[0,1,2,3,4],[0,2,4],[]]){
 resolver.candidates=id=>original(id).map(c=>({...c,url:c.url+(successful.includes(mapped.findIndex(card=>card.id===id))?'?image-test=thumb':'')}));
 w.dispatchEvent(new w.StorageEvent('storage',{key}));
 await wait(()=>cells().every((cell,i)=>successful.includes(i)?cell.querySelector('img')?.style.visibility==='visible':!cell.querySelector('img')));
 const list=w.document.querySelector('.formationMembers'),items=[...list.children];
 check([...w.document.querySelectorAll('.formationMemberTotal')].every((node,i)=>node.textContent===expected[i].toLocaleString('ja-JP')),'per SLOT totals equal simulator regardless of images');
 check(w.document.querySelector('.formationTotalWarning')?.textContent==='未反映の補正あり','unapplied corrections notice');
 for(const width of [1920,390,360]){
  frame.style.width=width+'px';await new Promise(r=>setTimeout(r,50));
  const columns=[...w.document.querySelectorAll('.formationThumbColumn')];
  check(columns.every(c=>Math.abs(c.getBoundingClientRect().top-columns[0].getBoundingClientRect().top)<1),'numeric totals keep five columns');
  check(columns.every(c=>c.querySelector('.formationMemberTotal').getBoundingClientRect().top>=c.querySelector('.formationThumb').getBoundingClientRect().bottom),'each total below own image');
  check(w.document.documentElement.scrollWidth<=width,'numeric totals fit mobile');
 }

 check(list.hidden===(successful.length===5),'hide empty text list');
 items.forEach((item,i)=>{check(item.hidden===successful.includes(i),'per-slot text visibility');check(item.value===i+1,'original SLOT numbering');check(item.textContent.includes(mapped[i].name)&&item.textContent.includes(mapped[i].member.name),'fallback identifies card');});
 check(!/card-|特訓|開花/.test(w.document.querySelector('.savedFormation').textContent),'no card IDs or growth in display');
 check(cells().every(cell=>!cell.title.includes('card-')),'no IDs in titles');
 check(localStorage.getItem(key)===stored,'image results do not mutate storage');
}
// Missing card or empty SLOT invalidates the entire party calculation without altering saved data.
for(const cardId of ['missing-card','']){
 const incomplete=JSON.parse(JSON.stringify(allSnapshot));incomplete.slots[1].cardId=cardId;store.save('画像検証',incomplete,saved.id);w.dispatchEvent(new w.StorageEvent('storage',{key}));
 check([...w.document.querySelectorAll('.formationMemberTotal')].every(node=>node.textContent==='—'),'no partial-party totals');
}
const helper=w.eval('UnitFormationTotals');
const affiliations=await(await fetch('../data/runtime-affiliations.json')).json();
for(const invalid of [{catalog,rules,affiliations:null},{catalog,rules,affiliations:{...affiliations,canonicalSha256:'wrong'}},{catalog,rules:null,affiliations},{catalog:null,rules,affiliations}])check(helper.calculate(invalid,allSnapshot).totals.every(v=>v===null),'missing/mismatched dependencies fail closed');
for(const bloom of [0,5])for(const leaderId of ['',allSnapshot.leaderId]){
 const input=JSON.parse(JSON.stringify(allSnapshot));input.leaderId=leaderId;input.slots.forEach(slot=>slot.bloom=bloom);
 sim.restore(input);const output=helper.calculate({catalog,rules,affiliations},input);
 check(JSON.stringify(output.totals)===JSON.stringify(sim.getModel().members.map(m=>m.parameters.subtotal.total)),'both skill levels and Leader modes match simulator');
}
const missingReference=JSON.parse(JSON.stringify(catalog));delete missingReference.cards.find(c=>c.id===mapped[0].id).skills.passive.levels[1].target;
check(helper.calculate({catalog:missingReference,rules,affiliations},allSnapshot).totals.every(v=>v===null),'missing Passive target blocks entire party');
simulator.remove();
out.textContent='PASS: totals match simulator, missing data fail closed;  all success/partial/all failure text, IDs/growth display-only removal, SLOT order, Thumb only, success/missing/empty, square five columns 1920/1280/768/390/360, max-width variable, unchanged storage, duplicate/delete/load link';
}catch(e){out.textContent='FAIL: '+e.stack}finally{if(backup===null)localStorage.removeItem(key);else localStorage.setItem(key,backup)}
})();
</script>
