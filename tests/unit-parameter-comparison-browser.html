<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parameter comparison browser tests</title>
<style>body{margin:0;font:14px system-ui}#result{white-space:pre-wrap}iframe{border:0;width:100%;height:1100px}</style>
<pre id="result">RUNNING</pre><iframe></iframe>
<script>
(async()=>{
const out=document.querySelector('#result'),frame=document.querySelector('iframe');
const check=(v,m)=>{if(!v)throw Error(m)};
const wait=async(predicate,label)=>{for(let i=0;i<200;i++){if(predicate())return;await new Promise(r=>setTimeout(r,25));}throw Error('Timeout: '+label)};
try{
frame.src='../unit-simulator.html';await new Promise(r=>frame.onload=r);
const w=frame.contentWindow;w.confirm=()=>true;
const api=await w.eval('unitSimulatorReady');check(api,'page ready');
const catalog=await(await fetch('../data/runtime-cards.json')).json();
const cards=catalog.cards.filter(c=>c.classification.rarity.mapping.value===5).slice(0,5);
check(catalog.cards.length===196,'public 196-card catalog preserved');
check(w.document.querySelectorAll('[data-unit-member]').length===5,'public member pickers preserved');
check(w.document.querySelector('#unitOptimizeRun'),'public optimizer preserved');
const state=api.capture();state.slots.forEach((s,i)=>{s.cardId=cards[i].id;s.training=2;s.bloom=3;s.totalAdjustments={board:{kind:'external-total',value:111},costume:{kind:'external-total',value:222}}});state.memoryPercent='6.4';state.enhancementPercent='2.43';state.trials='100';api.restore(state);
const scope=()=>w.document.querySelector('#unitParameterComparison');
const values=()=>[...scope().querySelectorAll('.parameterMember')];
const evidence=[];
for(const width of [1920,1280,768,390]){
 frame.style.width=width+'px';await new Promise(r=>setTimeout(r,50));
 const model=api.getModel();check(values().length===5,'five visible slot panels');
 const tops=values().map(n=>n.getBoundingClientRect().top);check(Math.max(...tops)-Math.min(...tops)<1,'never wraps '+width);
 for(let i=0;i<5;i++)for(const key of ['performance','technique','sense']){
  const row=values()[i].querySelector('[data-parameter="'+key+'"]');
  const p=model.members[i].parameters;const trace=p.trace.find(t=>t.kind==='Memory').parameters.find(t=>t.parameter===key);
  check(row.querySelector('.parameterBefore').textContent===trace.referenceValue.toLocaleString('ja-JP'),'post-Bloom engine value');
  check(row.querySelector('.parameterFinal').textContent===p.subtotal[key].toLocaleString('ja-JP'),'corrected engine value');
  if(p.passive.rates[key]===0)check(row.querySelector('.parameterRate').textContent===''&&row.querySelector('.parameterRate').getBoundingClientRect().height>=23,'blank zero keeps height');
 }
 for(const key of ['performance','technique','sense']){
  const y=values().map(n=>n.querySelector('[data-parameter="'+key+'"]').getBoundingClientRect().top);check(Math.max(...y)-Math.min(...y)<1,'PTS alignment '+width);
 }
 const scroll=scope().querySelector('.parameterComparisonScroll');
 if(width<=768){check(scroll.scrollWidth>scroll.clientWidth,'horizontal overflow '+width);scroll.scrollLeft=scroll.scrollWidth;check(scroll.scrollLeft>0,'scrollable '+width);scroll.scrollLeft=0;}
 check(w.document.documentElement.scrollWidth<=width+1,'page itself does not overflow '+width);
 check(scope().querySelectorAll('img,.parameterArt,.parameterImageStatus').length===0,'no image DOM or placeholder gutter '+width);
 check(values().every(n=>n.querySelector('.parameterMemberInfo').getBoundingClientRect().width+3>=n.getBoundingClientRect().width),'no reserved image column '+width);
 evidence.push(width+': aligned, '+(scroll.scrollWidth>scroll.clientWidth?'scroll':'fits'));
}
frame.style.width='1920px';await new Promise(r=>setTimeout(r,50));

const unchanged=JSON.stringify(api.capture());scope().querySelectorAll('.parameterMode button')[1].click();
check(scope().querySelectorAll('.parameterDetailTable').length===5,'details for each member');
check(JSON.stringify(api.capture())===unchanged,'display mode does not change saved format or inputs');
for(const width of [1920,1280,768,390]){
 frame.style.width=width+'px';await new Promise(r=>setTimeout(r,30));
 const tops=values().map(n=>n.getBoundingClientRect().top);check(Math.max(...tops)-Math.min(...tops)<1,'details never wraps '+width);
 check(values().every(n=>n.querySelector('.parameterDetailTable').getBoundingClientRect().right<=n.querySelector('.parameterMemberInfo').getBoundingClientRect().right+1),'detail tables fit their member panels '+width);
 check(w.document.documentElement.scrollWidth<=width+1,'details page does not overflow '+width);
}
frame.style.width='1920px';

check(values()[0].textContent.includes('Board')&&values()[0].textContent.includes('Enhancement'),'TOTAL-only corrections visible');
scope().querySelectorAll('.parameterMode button')[0].click();
check(w.performance.getEntriesByType('resource').filter(r=>r.initiatorType==='img').length===0,'no image requests');
// Exercise actual save/load controls; the Chrome profile is isolated.
w.document.querySelector('#unitFormationName').value='Parameter UI test';w.document.querySelector('#unitFormationName').dispatchEvent(new w.Event('input'));w.document.querySelector('#unitFormationNew').click();
const savedId=w.document.querySelector('#unitFormationList').value;check(savedId,'formation saved');
const changed=api.capture();changed.slots[0].cardId=catalog.cards.find(c=>c.id!==cards[0].id).id;api.restore(changed);
w.document.querySelector('#unitFormationList').value=savedId;w.document.querySelector('#unitFormationLoad').click();
check(api.capture().slots[0].cardId===cards[0].id&&values()[0].querySelector('.parameterCardName').textContent===cards[0].name,'formation reload updates comparison');
w.document.querySelector('#unitRun').click();check(w.document.querySelector('#unitResultStatus').textContent.includes('100試行'),'Active simulation still runs');
// Empty slots retain positions and aligned parameter rows.
const sparse=api.capture();sparse.slots[1].cardId='';sparse.slots[3].cardId='';api.restore(sparse);
check(values()[1].textContent.includes('カード未選択')&&values()[2].dataset.parameterSlot==='3','sparse slots retain order');
api.restore(state);scope().scrollIntoView({block:'start'});
out.textContent='PASS: '+evidence.join(' | ')+'; no image DOM/requests, engine values, zero rows, details, save/load, Active, sparse slots';
}catch(e){out.textContent='FAIL: '+e.stack}
})();
</script>
