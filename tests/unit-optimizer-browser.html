<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe style="height:800px;border:0"></iframe>
<script>
(async()=>{
 const out=document.querySelector('#result'),frame=document.querySelector('iframe');
 const check=(ok,message)=>{if(!ok)throw Error(message);};
 const pause=()=>new Promise(resolve=>setTimeout(resolve,0));
 async function finish(w){
  for(let i=0;i<200&&!w.document.querySelector('#unitOptimizeStatus').textContent.includes('探索完了');i++)await pause();
  check(w.document.querySelector('#unitOptimizeStatus').textContent.includes('探索完了'),'optimization completed');
 }
 try{
  const examples=[];
  for(const width of [1100,360]){
   frame.style.width=width+'px';
   const w=await new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);frame.src='../unit-simulator.html?optimizer='+width;});
   const api=await w.eval('unitSimulatorReady'),catalog=await w.loadRuntimeCardCatalog();
   const ids=['sakura_miko','kobo_kanaeru','azki','tsunomaki_watame','hoshimachi_suisei'];
   const cards=ids.map(id=>catalog.cards.find(card=>w.canonicalMemberId(card)===id&&card.classification.rarity.mapping.value===5));
   const spLabels=()=>[...w.document.querySelectorAll('.unitSPName')].map(n=>n.textContent);
   const labels=()=>[...w.document.querySelectorAll('.unitOptimizeName')].map(n=>n.textContent);
   check(labels().every(t=>t==='未選択 上限')&&spLabels().every(t=>t==='未選択 (秒)'),'unselected names');
   check([...w.document.querySelectorAll('[data-unit-optimize-limit]')].every(n=>n.value==='12'),'initial upper limit is 12');
   const selects=[...w.document.querySelectorAll('[data-unit-card]')];
   selects.forEach((select,i)=>{select.value=cards[i].id;select.dispatchEvent(new w.Event('change'));});
   const limits=[...w.document.querySelectorAll('[data-unit-optimize-limit]')];
   check(limits.length===5,'five limits');
   const expectedLabels=['みこ 上限','こぼ 上限','AZKi 上限','わため 上限','すいせい 上限'];
   check(JSON.stringify(labels())===JSON.stringify(expectedLabels),'five explicit short names from current cards');
   const expectedNames=['みこ','こぼ','AZKi','わため','すいせい'];
   const checkSP=()=>{
    const current=api.getModel();
    const expected=current.specialSchedule.entries.map(e=>w.eval('TalentPresentation').resolve(w.canonicalMemberId(current.members[e.slot-1].card),current.members[e.slot-1].card.member.name).displayName).join('→');
    check(w.document.querySelector('#unitSPCurrentOrder').textContent==='現在のSP順序：'+expected,'current order uses names in engine order');
   };
   check(JSON.stringify(spLabels())===JSON.stringify(expectedNames.map(n=>n+' (秒)')),'SP labels share short names');checkSP();
   check([...w.document.querySelectorAll('#unitSPSchedule [data-sp-slot]')].map(n=>n.dataset.spSlot).join(',')==='1,2,3,4,5','SP inputs retain slot identities');
   const spDetails=w.document.querySelector('#unitSPSchedule').parentElement;spDetails.open=true;
   const preserved=['0','4','8','12','4'];limits.forEach((n,i)=>n.value=preserved[i]);
   const original=api.capture();
   const longCard=catalog.cards.find(c=>w.canonicalMemberId(c)==='kaela_kovalskia');check(longCard,'long formal name card');
   selects[0].value=longCard.id;selects[0].dispatchEvent(new w.Event('change'));
   check(labels()[0]===longCard.member.name+' 上限'&&spLabels()[0]===longCard.member.name+' (秒)','undefined abbreviation uses full formal name');checkSP();
   const spName=w.document.querySelector('.unitSPName'),spInput=w.document.querySelector('#unitSPSchedule [data-sp-slot]');
   check(spName.getBoundingClientRect().right<=spName.parentElement.getBoundingClientRect().right+1&&spInput.getBoundingClientRect().width>=100,'long SP name fits and input retains width');
   const nameNode=w.document.querySelector('.unitOptimizeName'),selectNode=limits[0];
   check(nameNode.getBoundingClientRect().right<=nameNode.parentElement.getBoundingClientRect().right+1&&selectNode.getBoundingClientRect().width>=100,'long name fits without shrinking control');
   check(w.document.documentElement.scrollWidth<=width,'long name viewport fit');
   api.restore(original);check(JSON.stringify(labels())===JSON.stringify(expectedLabels),'restore refreshes names');
   check(limits.every((n,i)=>n.value===preserved[i]),'restore and card changes preserve selected limits');
   const save=w.document.querySelector('#unitFormationNew');w.confirm=()=>true;save.click();
   const savedId=w.document.querySelector('#unitFormationList').value;check(savedId,'save formation for label reload');
   selects[0].value='';selects[0].dispatchEvent(new w.Event('change'));check(labels()[0]==='未選択 上限','clearing updates name');
   w.document.querySelector('#unitFormationList').value=savedId;w.document.querySelector('#unitFormationLoad').click();
   check(JSON.stringify(labels())===JSON.stringify(expectedLabels)&&limits.every((n,i)=>n.value===preserved[i]),'saved formation load updates labels without overwriting limits');
   check(JSON.stringify(spLabels())===JSON.stringify(expectedNames.map(n=>n+' (秒)')),'save/load updates SP names');checkSP();
   check(!Object.hasOwn(api.capture(),'optimizeLimits'),'saved format unchanged');
   limits.forEach(input=>{input.value='0';});
   const sp=w.document.querySelector('#unitShowSP'),run=w.document.querySelector('#unitOptimizeRun');
   sp.checked=false;sp.dispatchEvent(new w.Event('change'));
   const before=api.getModel();
   const expected=w.eval('TimelineOptimizer').optimizeActive(before.activeMembers,before.duration,[0,0,0,0,0]);
   run.click();await finish(w);
   check(JSON.stringify(api.getModel().activeMembers.map(m=>m.short))===JSON.stringify(expected.shorts),'SP OFF matches A optimizer');checkSP();
   check(api.getModel().activeOnlyX===before.activeOnlyX,'SP OFF Active calculation unchanged');
   sp.checked=true;sp.dispatchEvent(new w.Event('change'));
   const initial=api.getModel().allSuccessScore;
   run.click();await finish(w);
   const optimized=api.getModel();
   check(optimized.allSuccessScore>=initial-1e-7,'SP optimization improves or ties');
   const order=optimized.specialSchedule.entries.map(entry=>entry.slot);
   examples.push(`${width}px ${order.join('→')} (${initial.toFixed(2)}→${optimized.allSuccessScore.toFixed(2)})`);
   check(order.length===5&&new Set(order).size===5,'SP order represented in schedule');checkSP();
   check(w.document.querySelector('.unitOptimizedSPOrder').textContent===' / SP順序 '+order.map(slot=>expectedNames[slot-1]).join('→'),'optimizer result uses talent names');
   const namedSnapshot=api.capture(),rawOrder=JSON.stringify(namedSnapshot.specialOrder);
   const renamed=JSON.parse(JSON.stringify(namedSnapshot));renamed.slots[0].cardId=longCard.id;api.restore(renamed);
   check(JSON.stringify(api.capture().specialOrder)===rawOrder,'name refresh keeps numeric order');checkSP();
   check(w.document.querySelector('.unitOptimizedSPOrder').textContent.includes(longCard.member.name),'result label refreshes on member change');
   api.restore(namedSnapshot);checkSP();
   check(api.capture().specialOrder.every(Number.isInteger),'saved order remains numeric slots');
   check(w.document.querySelector('#unitOptimizeStatus').textContent.includes('120通り'),'all 120 SP orders evaluated');
   check(api.capture().specialOrder.join(',')===order.join(','),'optimized order captured for save');
   const snapshot=api.capture();
   w.document.querySelector('#unitFormationNew').click();const orderedSavedId=w.document.querySelector('#unitFormationList').value;
   const changed=api.capture();changed.slots[0].cardId=longCard.id;api.restore(changed);
   w.document.querySelector('#unitFormationList').value=orderedSavedId;w.document.querySelector('#unitFormationLoad').click();
   check(JSON.stringify(api.capture().specialOrder)===JSON.stringify(snapshot.specialOrder),'saved numeric order round-trip');checkSP();
   api.restore(snapshot);
   check(api.getModel().specialSchedule.entries.map(entry=>entry.slot).join(',')===order.join(','),'SP order restored');
   const legacy=JSON.parse(JSON.stringify(snapshot));delete legacy.specialOrder;api.restore(legacy);
   check(api.capture().specialOrder===null,'legacy snapshot without explicit order remains compatible');checkSP();
   check(w.document.querySelector('.unitOptimizedSPOrder').textContent==='','stale optimized order cleared on legacy restore');
   api.restore(snapshot);checkSP();
   const simulation=w.eval('UnitSimulatorEngine'),random=w.eval('ActiveRandomSimulation');
   const seededA=simulation.simulate(api.getModel(),20,random.seededRandom(123)).values;
   const seededB=simulation.simulate(api.getModel(),20,random.seededRandom(123)).values;
   check(JSON.stringify(seededA)===JSON.stringify(seededB),'fixed-seed simulation unchanged');
   check(optimized.specialSchedule.entries.every((entry,i,items)=>i===0||entry.start>=items[i-1].end),'nonoverlap retained');
   limits.forEach(input=>{input.value='12';});
   check(w.eval('TimelineOptimizer').count(limits.map(input=>Number(input.value)),120)===122880,'exact cap accepted');
   check(w.eval('TimelineOptimizer').count(limits.map(input=>Number(input.value)),121)>122880,'above-cap count');
   const optimizer=w.eval('TimelineOptimizer'),permutations=optimizer.permutations;
   optimizer.permutations=()=>Array.from({length:121},()=>[1,2,3,4,5]);run.click();
   check(w.document.querySelector('#unitOptimizeStatus').textContent.includes('上限122,880'),'above-cap UI rejects before search');
   check(!run.disabled,'above-cap leaves controls available');
   optimizer.permutations=permutations;
   run.click();
   check(run.disabled&&w.document.querySelector('#unitOptimizeStatus').textContent.includes('25 / 122,880'),'max search starts and reports progress');
   w.document.querySelector('#unitOptimizeCancel').click();await pause();
   check(!run.disabled&&w.document.querySelector('#unitOptimizeStatus').textContent.includes('中断'),'max search can be cancelled');
   limits.forEach(input=>{input.value='4';});run.click();
   check(run.disabled&&w.document.querySelector('#unitOptimizeCancel').disabled===false,'running state and cancel');
   check(w.document.querySelector('#unitOptimizeStatus').textContent.includes('25 / 3,840'),'progress after first batch');
   w.document.querySelector('#unitOptimizeCancel').click();await pause();
   check(!run.disabled&&w.document.querySelector('#unitOptimizeStatus').textContent.includes('中断'),'cancel restores controls');
   if(width===1100){run.click();await finish(w);
    check(w.document.querySelector('#unitOptimizeStatus').textContent.includes('3,840通り'),'full 4 percent search completes');
    sp.checked=false;sp.dispatchEvent(new w.Event('change'));limits.forEach(input=>{input.value='12';});run.click();await finish(w);
    check(w.document.querySelector('#unitOptimizeStatus').textContent.includes('1,024通り'),'SP OFF uses common cap and completes');}
   check(w.document.documentElement.scrollWidth<=width,'viewport fit');
  }
  out.textContent='PASS: SP names/current/result order, numeric persistence, long labels; 12% defaults, talent labels, formal/empty fallback, preserved limits, save/load; A parity, SP 120 orders, score and schedule reflection, cap; '+examples.join(' / ');
 }catch(error){out.textContent='FAIL: '+error.stack;}
})();
</script>
