<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ホロドリ Active Timeline α</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#202124;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.sub{color:#666;font-size:13px}.top{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.top label{width:150px}input,select{width:100%;font:inherit;padding:8px;border:1px solid #bbb;border-radius:8px;background:#fff}.cards{display:grid;gap:9px}.card{display:grid;grid-template-columns:1.25fr 1.25fr repeat(5,.75fr);gap:8px;align-items:end;padding:10px;border:1px solid #e2e2e2;border-radius:10px}.card label{font-size:11px;color:#666}.slot{font-weight:700;margin-right:5px}.metrics{display:flex;gap:32px;flex-wrap:wrap}.metric b{display:block;font-size:25px}.timeline-scroll{overflow-x:auto}.timeline{min-width:760px}.axis,.row{display:grid;grid-template-columns:150px 1fr;gap:8px}.axisTrack{position:relative;height:30px;border-top:1px solid #999}.tick{position:absolute;top:-5px;width:1px;height:9px;background:#999}.tick span{position:absolute;top:10px;transform:translateX(-50%);font-size:11px;color:#666}.name{font-size:12px;padding-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{position:relative;height:42px;background:repeating-linear-gradient(to right,#fafafa 0,#fafafa calc(10% - 1px),#e7e7e7 calc(10% - 1px),#e7e7e7 10%);border-radius:7px;overflow:hidden}.bar{position:absolute;top:7px;height:28px;border-radius:5px;border:1px solid #536dfe;background:#dce3ff;color:#1f2c67;font-size:10px;padding:5px 4px;overflow:hidden;white-space:nowrap;cursor:pointer}.bar:hover{filter:brightness(.97)}#detail{min-height:24px;margin-top:8px;font-size:13px;color:#555}.note{font-size:12px;color:#666;margin-top:8px}@media(max-width:800px){.card{grid-template-columns:1fr 1fr}.wrap{padding:10px}}
</style>
</head>
<body><main class="wrap">
<div class="panel"><h1>ホロドリ Active Timeline α</h1><div class="sub">5枠を手入力して、Activeの発動候補タイミングとMAX評価値を可視化</div></div>
<div class="panel top"><label>楽曲時間 (s)<input id="song" type="number" min="1" step="0.01" value="120"></label><div class="sub">初期値 120.00s ／ 表示は小数第2位、内部値は丸めません</div></div>
<div class="panel"><h2>編成・Active入力</h2><div id="cards" class="cards"></div></div>
<div class="panel"><div class="metrics"><div class="metric"><span class="sub">MAX発動スコア評価値</span><b id="max">0.00</b></div><div class="metric"><span class="sub">曲全体平均Active補正</span><b id="avg">+0.00%</b></div><div class="metric"><span class="sub">発動候補数</span><b id="count">0</b></div></div><div class="note">評価値 = ∫ max(発動中Active補正率) dt。重複区間は最も高い補正だけを採用します。</div></div>
<div class="panel"><h2>Activeタイムライン</h2><div class="timeline-scroll"><div id="timeline" class="timeline"></div></div><div id="detail">バーを選ぶと詳細を表示します。</div></div>
</main>
<script>
const init=Array.from({length:5},()=>['','', '', 'mid', '', '', 0]);
const probs={low:35,mid:45,high:55};
const cards=document.querySelector('#cards');
init.forEach((d,i)=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<label><span class="slot">${i+1}</span>キャラ<input data-k="name" value="${d[0]}"></label><label>衣装<input data-k="costume" value="${d[1]}"></label><label>周期(s)<input data-k="interval" type="number" min="0.01" step="0.01" value="${d[2]}"></label><label>確率<select data-k="prob"><option value="low">低</option><option value="mid">中</option><option value="high">高</option></select></label><label>発動時間(s)<input data-k="duration" type="number" min="0" step="0.01" value="${d[4]}"></label><label>補正(%)<input data-k="boost" type="number" min="0" step="0.01" value="${d[5]}"></label><label>短縮<select data-k="short"><option>0</option><option>4</option><option>8</option><option>12</option></select></label>`;el.querySelector('[data-k=prob]').value=d[3];el.querySelector('[data-k=short]').value=d[6];cards.append(el)});
function num(v,f=0){const x=Number(v);return Number.isFinite(x)?x:f}
function getMembers(){return [...document.querySelectorAll('.card')].map((c,i)=>{const g=k=>c.querySelector(`[data-k=${k}]`).value;return{slot:i+1,name:g('name')||`枠${i+1}`,costume:g('costume'),interval:Math.max(0,num(g('interval'),0)),prob:g('prob'),duration:Math.max(0,num(g('duration'))),boost:Math.max(0,num(g('boost'))),short:num(g('short'))}})}
// α版の短縮計算は base interval × (1 - short/100)。仕様確定時はこの1関数だけ差し替え可能。
function adjustedInterval(m){return m.interval>0?m.interval*(1-m.short/100):0}
function events(m,T){const iv=adjustedInterval(m),out=[];if(iv<=0||m.duration<=0||m.boost<=0)return out;for(let t=iv;t<=T+1e-9&&out.length<1000;t+=iv)out.push({start:t,end:Math.min(T,t+m.duration),boost:m.boost,m});return out}
function calcMax(all,T){const pts=[0,T];all.forEach(e=>{pts.push(e.start,e.end)});pts.sort((a,b)=>a-b);let total=0;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(b<=a)continue;const mid=(a+b)/2;let mx=0;for(const e of all)if(e.start<=mid&&mid<e.end)mx=Math.max(mx,e.boost);total+=mx*(b-a)}return total}
function render(){const T=Math.max(.01,num(document.querySelector('#song').value,120)),ms=getMembers(),by=ms.map(m=>events(m,T)),all=by.flat(),max=calcMax(all,T);document.querySelector('#max').textContent=max.toFixed(2);document.querySelector('#avg').textContent=`+${(max/T).toFixed(2)}%`;document.querySelector('#count').textContent=all.length;const tl=document.querySelector('#timeline');tl.innerHTML='';const axis=document.createElement('div');axis.className='axis';axis.innerHTML='<div></div><div class="axisTrack"></div>';const at=axis.lastElementChild;for(let i=0;i<=10;i++){const x=i*10,t=T*i/10,d=document.createElement('div');d.className='tick';d.style.left=x+'%';d.innerHTML=`<span>${t.toFixed(2)}</span>`;at.append(d)}tl.append(axis);ms.forEach((m,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="name">${m.slot}. ${m.name}<br><span class="sub">${m.interval>0?adjustedInterval(m).toFixed(2)+'s周期':'未入力'}</span></div><div class="track"></div>`;const tr=row.lastElementChild;by[i].forEach((e,n)=>{const b=document.createElement('button');b.type='button';b.className='bar';b.style.left=(e.start/T*100)+'%';b.style.width=(Math.max(0,e.end-e.start)/T*100)+'%';b.textContent=`+${m.boost.toFixed(2)}%`;b.title=`${e.start.toFixed(2)}–${e.end.toFixed(2)}s`;b.addEventListener('click',()=>{document.querySelector('#detail').textContent=`${m.name} / ${m.costume||'衣装未入力'} — 第${n+1}候補 ${e.start.toFixed(2)}s → ${e.end.toFixed(2)}s / ${m.prob==='low'?'低':m.prob==='mid'?'中':'高'} ${probs[m.prob].toFixed(2)}% / +${m.boost.toFixed(2)}% / 短縮 ${m.short.toFixed(2)}%`});tr.append(b)});tl.append(row)})}
document.addEventListener('input',e=>{if(e.target.closest('.wrap'))render()});document.addEventListener('change',e=>{if(e.target.closest('.wrap'))render()});render();
</script></body></html>
