<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ホロドリ イベント編成探索</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="container">

    <header class="pageHeader">
      <div>
        <h1>イベント編成探索</h1>
        <p class="sub">
          イベント条件から編成候補を探索
        </p>
      </div>

      <nav>
        <a href="index.html">
          Active Timeline
        </a>

        <a href="library.html">
          カードライブラリ
        </a>
      </nav>
    </header>


     <div id="canonicalCardModal" class="cardLoadModal" hidden>
       <div class="cardLoadBackdrop" data-close-canonical-card-modal></div>
       <div class="cardLoadDialog" role="dialog" aria-modal="true" aria-labelledby="canonicalCardTitle">
         <div class="cardLoadHeader">
           <strong id="canonicalCardTitle">カード呼び出し</strong>
           <button type="button" data-close-canonical-card-modal>閉じる</button>
         </div>
         <div id="canonicalCardTarget" class="sub"></div>
         <p id="canonicalCardStatus" class="sub" role="status" aria-live="polite"></p>
         <div id="canonicalCardList" class="canonicalCardList"></div>
       </div>
     </div>
    <!-- =====================================
         必須メンバー
    ====================================== -->
    <script src="canonical-card-adapter.js"></script>

    <section class="panel">

      <h2>必須メンバー</h2>

      <p class="sub">
        最大4人まで指定できます。
        メンバー選択後、必要なら使用カードまで固定できます。
      </p>

      <div
        id="requiredSlots"
        class="requiredSlots"
      ></div>

    </section>


    <!-- =====================================
         探索
    ====================================== -->

    <section class="panel">

      <h2>探索</h2>

      <div class="eventSearchActions">

        <button
          id="searchFormation"
          type="button"
        >
          編成候補を計算
        </button>

        <button
          id="clearConditions"
          type="button"
        >
          条件クリア
        </button>

      </div>

      <p
        id="searchStatus"
        class="sub"
      ></p>

    </section>


    <!-- =====================================
         結果
    ====================================== -->

    <section class="panel">

      <h2>編成候補</h2>

      <div
        id="formationResults"
        class="formationResults"
      >
        <div class="libraryEmpty">
          条件を指定して探索してください
        </div>
      </div>

    </section>

  <section class="panel" aria-label="データについて">
  <h2>データについて</h2>
  <p class="sub">基礎パラメータは特訓上限Lvの収録値です。Bloom補正は含まず、能力別の値・合計値への換算は未確定です。</p>
  <p class="sub">現在の計算反映はActive Skill基本効果のみです。条件付き効果・Passive・Special・Connect・ステータスは計算に反映しません。</p>
</section>
</main>


  <script src="members.js"></script>
  <script src="card-rules.js"></script>
  <script src="event.js"></script>

</body>
</html>
