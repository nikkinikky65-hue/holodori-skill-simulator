<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ホロドリ リーダースキル一覧</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="talent-filter.css">
<script src="site-navigation.js" defer></script>
</head>
<body>
<main class="wrap">
<section class="panel">
  <h1>リーダースキル一覧</h1>
  <p class="sub">効果 → 効果量 → タレント・条件・カードの順に比較できます。対象は全員です。複合効果は別枠にまとめています。効果の計算・編成への適用は行いません。</p>
  <div id="leaderTalentFilter"></div>
  <p id="leaderStatus" role="status">読み込み中…</p>
</section>
<p id="leaderEmpty" class="panel" hidden>選択したタレントに該当するリーダースキルはありません。</p>
<section aria-label="カード固有のリーダースキル" id="leaderCards"></section>
<section class="panel">
  <h2>基礎衣装 共通効果</h2>
  <p class="sub">基礎衣装の15%効果は主一覧から分離した参考情報です。★3を含むカードへの自動付与・対応付けは行いません。</p>
  <p id="leaderCommonEmpty" hidden>選択したタレントの共通効果はありません。</p>
  <details><summary>取得済みの共通効果を見る</summary><div id="leaderCommon"></div></details>
</section>
</main>
<script src="members.js"></script>
<script src="canonical-card-adapter.js?v=8f18296bae96"></script>
<script src="talent-presentation.js"></script><script src="talent-filter.js"></script>
<script src="skill-description-text.js"></script><script src="leader.js"></script>
</body>
</html>
