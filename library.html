<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ホロドリ メンバーカードライブラリ</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="wrap">

  <div class="panel">
    <h1>メンバーカードライブラリ</h1>

    <div class="sub">
      所持しているメンバーカードを登録・管理します。
    </div>

    <div class="libraryNav">
      <a href="index.html">← Active Timelineへ戻る</a>
    </div>
  </div>


  <div class="panel">

    <h2>メンバーカード登録</h2>

    <form id="memberCardForm" class="libraryCardForm">

  <input
    id="memberCardId"
    type="hidden"
  >


  <!-- =========================
       基本情報
  ========================== -->
<section class="libraryFormSection">
  <h3>基本情報</h3>

  <label>
    タレント

    <select
      id="cardTalent"
      required
    >
      <option value="">
        選択してください
      </option>
    </select>
  </label>


  <label>
    カード名

    <input
      id="cardName"
      type="text"
      required
    >
  </label>


  <label>
    タイプ

    <select
      id="cardType"
      required
    >
      <option value="cute">キュート</option>
      <option value="pure">ピュア</option>
      <option value="happy">ハッピー</option>
    </select>
  </label>


  <label>
    レア度

    <select
      id="cardRarity"
      required
    >
      <option value="3">★3</option>
      <option value="4">★4</option>
      <option value="5">★5</option>
    </select>
  </label>
</section>

  <!-- =========================
       育成状態
  ========================== -->
<section class="libraryFormSection">
  <h3>育成状態</h3>

  <label>
    レベル

    <input
      id="cardLevel"
      type="number"
      min="1"
      step="1"
      required
    >
  </label>


  <label>
    特訓

    <input
      id="cardTraining"
      type="number"
      min="0"
      step="1"
      required
    >
  </label>


  <label>
    開花

    <input
      id="cardBloom"
      type="number"
      min="0"
      step="1"
      required
    >
  </label>
</section>

  <!-- =========================
       ステータス
  ========================== -->
<section class="libraryFormSection">
  <h3>ステータス</h3>

  <label>
    トータル

    <input
      id="cardTotal"
      type="number"
      min="0"
      step="1"
    >
  </label>


  <label>
    パフォーマンス

    <input
      id="cardPerformance"
      type="number"
      min="0"
      step="1"
    >
  </label>


  <label>
    テクニック

    <input
      id="cardTechnique"
      type="number"
      min="0"
      step="1"
    >
  </label>


  <label>
    センス

    <input
      id="cardSense"
      type="number"
      min="0"
      step="1"
    >
  </label>

</section>

  <!-- =========================
     スキル
========================== -->

<h3>スキル</h3>


<!-- スペシャルスキル -->

<h4>スペシャルスキル</h4>

<label>
  スキル名

  <input
    id="specialSkillName"
    type="text"
  >
</label>

<label>
  効果

  <textarea
    id="specialSkillDescription"
    rows="3"
  ></textarea>
</label>


<!-- アクティブスキル -->

<h4>アクティブスキル</h4>

<label>
  スキル名

  <input
    id="activeSkillName"
    type="text"
  >
</label>

<label>
  周期(s)

  <input
    id="activeSkillInterval"
    type="number"
    min="0"
    step="0.01"
  >
</label>

<label>
  発動確率

  <select id="activeSkillProb">
    <option value="low">低</option>
    <option value="mid" selected>中</option>
    <option value="high">高</option>
  </select>
</label>

<label>
  発動時間(s)

  <input
    id="activeSkillDuration"
    type="number"
    min="0"
    step="0.01"
  >
</label>

<label>
  補正(%)

  <input
    id="activeSkillBoost"
    type="number"
    min="0"
    step="0.01"
  >
</label>

<label>
  効果

  <textarea
    id="activeSkillDescription"
    rows="3"
  ></textarea>
</label>


<!-- パッシブスキル -->

<h4>パッシブスキル</h4>

<label>
  スキル名

  <input
    id="passiveSkillName"
    type="text"
  >
</label>

<label>
  効果

  <textarea
    id="passiveSkillDescription"
    rows="3"
  ></textarea>
</label>


<!-- =========================
     衣装スキル
========================== -->

<h3>衣装スキル</h3>

<label>
  スキル名

  <input
    id="outfitSkillName"
    type="text"
  >
</label>

<label>
  効果

  <textarea
    id="outfitSkillDescription"
    rows="3"
  ></textarea>
</label>


  <div class="libraryFormButtons">

    <button type="submit">
      保存
    </button>

    <button
      id="memberCardCancel"
      type="button"
    >
      キャンセル
    </button>

  </div>

</form>

  </div>


  <div class="panel">

    <h2>登録済みカード</h2>

    <div
      id="memberCardCount"
      class="sub"
    ></div>

    <div
      id="memberCardList"
      class="libraryList"
    ></div>

  </div>

</main>


<!-- 順番重要 -->
<script src="members.js"></script>
<script src="library.js"></script>

</body>
</html>
