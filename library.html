<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ホロドリ メンバーカードライブラリ</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="wrap">

  <div class="panel">
    <h1>メンバーカードライブラリ</h1>

    <div class="sub">
      所持しているメンバーカードを登録・管理します。
    </div>

    <div class="libraryNav">
      <a href="index.html">← Active Timelineへ戻る</a>
    </div>
  </div>


  <div class="panel">

    <h2>メンバーカード登録</h2>

    <form id="memberCardForm" class="libraryCardForm">

  <input
    id="memberCardId"
    type="hidden"
  >


  <!-- =========================
       基本情報
  ========================== -->
<section class="libraryFormSection basicInfoSection">
  <h3>基本情報</h3>

  <label>
    メンバー

    <select
      id="cardTalent"
      required
    >
      <option value="">
        選択してください
      </option>
    </select>
  </label>


  <label>
    タイプ

    <select id="cardType">
      <option value="" selected>未登録</option>
      <option value="cute">キュート</option>
      <option value="pure">ピュア</option>
      <option value="happy">ハッピー</option>
    </select>
  </label>


  <label>
    レア度

    <select
      id="cardRarity"
      required
    >
      <option value="3">★3</option>
      <option value="4">★4</option>
      <option value="5" selected>★5</option>
    </select>
  </label>


  <label class="cardNameField">
    カード名

    <input
      id="cardName"
      type="text"
      placeholder="未分類"
    >
  </label>

</section>

  <!-- =========================
       育成状態
  ========================== -->
<section class="libraryFormSection">
  <h3>育成状態</h3>

  <label>
    レベル

    <input
      id="cardLevel"
      type="number"
      min="1"
      step="1"
      readonly
      required
    >
  </label>


  <label>
    特訓

    <input
      id="cardTraining"
      type="number"
      min="0"
      max="4"
      step="1"
      value="0"
      required
    >
  </label>


  <label>
    開花

    <input
      id="cardBloom"
      type="number"
      min="0"
      max="5"
      step="1"
      value="0"
      required
    >
  </label>
</section>

  <!-- =========================
       ステータス
  ========================== -->
<section class="libraryFormSection">
  <h3>ステータス</h3>
  <p id="statPresetNote" class="sub libraryPresetNote" aria-hidden="true"></p>

  <label>
    トータル

    <input
      id="cardTotal"
      type="number"
      min="0"
      step="1"
    >
  </label>


  <label>
    パフォーマンス

    <input
      id="cardPerformance"
      type="number"
      min="0"
      step="1"
    >
  </label>


  <label>
    テクニック

    <input
      id="cardTechnique"
      type="number"
      min="0"
      step="1"
    >
  </label>


  <label>
    センス

    <input
      id="cardSense"
      type="number"
      min="0"
      step="1"
    >
  </label>

</section>

  <!-- =========================
     スキル
========================== -->

<h3>スキル</h3>

<div class="librarySkillsGrid">

<!-- スペシャルスキル -->
<section class="libraryFormSection librarySkillPanel librarySpecialPanel">
  <h4>SPスキル</h4>
  <label>効果種別（複数選択可）<select id="specialEffectTypes" multiple size="4"></select></label>

  <label>
    効果時間(s)
    <input
      id="specialSkillDuration"
      type="number"
      min="0"
      step="0.01"
    >
  </label>

  <label>
    効果値（%）
    <input
      id="specialSkillBoost"
      type="number"
      min="0"
      step="0.01"
    >
  </label>

  <label class="librarySecondaryField">
    効果
    <textarea
      id="specialSkillDescription"
      rows="3"
    ></textarea>
  </label>
</section>

<!-- アクティブスキル -->
<section class="libraryFormSection librarySkillPanel libraryActivePanel">
<h4>Aスキル</h4>
<label>効果種別<select id="activeEffectType"></select></label>


<label>
  周期(s)

  <input
    id="activeSkillInterval"
    type="number"
    min="0"
    step="0.01"
  >
</label>

<label>
  発動確率

  <select id="activeSkillProb">
    <option value="low">低</option>
    <option value="mid" selected>中</option>
    <option value="high">高</option>
  </select>
</label>

<label>
  発動時間(s)

  <input
    id="activeSkillDuration"
    type="number"
    min="0"
    step="0.01"
  >
</label>

<label>
  効果値（%）

  <input
    id="activeSkillBoost"
    type="number"
    min="0"
    step="0.01"
  >
</label>

<label class="librarySecondaryField">
  効果

  <textarea
    id="activeSkillDescription"
    rows="3"
  ></textarea>
</label>
</section>

<!-- パッシブスキル -->
<section class="libraryFormSection librarySkillPanel libraryPassivePanel">
  <h4>Pスキル</h4>
  <label>効果種別<select id="passiveEffectType"></select></label>
  <label>条件<select id="passiveCondition"></select></label>
  <label id="passiveConditionTextLabel" hidden>条件の原文<input id="passiveConditionText" type="text"></label>
  <label>人数（以上）<input id="passiveConditionCount" type="number" min="0" step="1" value="0"></label>
  <label>対象条件<select id="passiveTarget"></select></label>
  <label id="passiveTargetTextLabel" hidden>対象条件の原文<input id="passiveTargetText" type="text"></label>
  <label>人数（指定）<input id="passiveTargetCount" type="number" min="0" step="1" value="0"></label>
  <label>効果値（%）<input id="passiveValue" type="number" min="0" step="0.01" value="0"></label>
  <label class="librarySecondaryField">説明<textarea id="passiveDescription" rows="3"></textarea></label>
  <details id="legacyPassiveDetails" hidden>
    <summary>旧カードのステータス説明</summary>
    <label>保存済みの説明（効果種別の自動推定はしません）<textarea id="passiveSkillDescription1" rows="3"></textarea></label>
  </details>
</section>
</div>

<!-- =========================
     衣装スキル
========================== -->

<section class="libraryFormSection libraryOutfitSection">
<h3>衣装スキル</h3>

<label>
  スキル名

  <input
    id="outfitSkillName"
    type="text"
  >
</label>

<label>
  効果

<label class="librarySecondaryField">
  <textarea
    id="outfitSkillDescription"
    rows="3"
  ></textarea>
</label>
</section>


  <div class="libraryFormButtons">

    <button type="submit">
      保存
    </button>

    <button
      id="memberCardCancel"
      type="button"
    >
      キャンセル
    </button>

  </div>

</form>

  </div>


  <div class="panel">

    <h2>登録済みカード</h2>

    <div
      id="memberCardCount"
      class="sub"
    ></div>

    <div
      id="memberCardList"
      class="libraryList"
    ></div>

  </div>

</main>


<!-- 順番重要 -->
<script src="members.js"></script>
<script src="card-rules.js"></script>
<script src="library.js"></script>

</body>
</html>
